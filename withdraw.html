<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM 2027 | Withdraw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-center px-4 py-8">

    <div class="max-w-md w-full mx-auto mb-4 flex items-center">
        <a href="dashboard.html" class="text-gray-400 hover:text-white text-lg transition-colors mr-4">
            <i class="fas fa-chevron-left"></i>
        </a>
        <h3 class="text-lg font-bold flex items-center text-red-500">
            <i class="fa-solid fa-arrow-up-from-bracket mr-2"></i> Lacag la bixid
        </h3>
    </div>

    <div class="max-w-md w-full mx-auto bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl space-y-6">
        
        <div class="bg-gray-950 p-4 rounded-xl border border-gray-800/60 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 uppercase tracking-wider">Balance-kaaga hadda</p>
                <h2 id="currentBal" class="text-2xl font-black text-red-500 mt-1">$0.00</h2>
            </div>
            <div class="p-3 bg-red-500/10 text-red-500 rounded-xl text-xl border border-red-500/20">
                <i class="fa-solid fa-building-columns"></i>
            </div>
        </div>

        <form id="withForm" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Cadadka ($)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-red-500 font-bold"><i class="fa-solid fa-dollar-sign"></i></span>
                    <input type="number" id="amount" placeholder="Cadadka lacagta ($)" required min="1" class="w-full bg-gray-950 rounded-xl pl-10 pr-4 py-3 border border-gray-800 focus:outline-none focus:border-red-500 text-white font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Dooro Habka Lacagta</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-money-check-dollar"></i></span>
                    <select id="method" class="w-full bg-gray-950 rounded-xl pl-10 pr-4 py-3 border border-gray-800 focus:outline-none focus:border-red-500 text-white appearance-none cursor-pointer">
                        <option value="EVC Plus">EVC Plus (Hormuud)</option>
                        <option value="eDahab">eDahab (Somtel)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Lambarka Teleefanka</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-phone"></i></span>
                    <input type="tel" id="phone" placeholder="61XXXXXXX" required class="w-full bg-gray-950 rounded-xl pl-10 pr-4 py-3 border border-gray-800 focus:outline-none focus:border-red-500 text-white font-mono">
                </div>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-bold transition-all shadow-lg shadow-red-600/10 flex justify-center items-center uppercase tracking-wider text-sm" id="withBtn">
                CODSO LACAG KALA BAX
            </button>
        </form>
    </div>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { doc, onSnapshot, updateDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        let userBal = 0, uData = {};

        auth.onAuthStateChanged(user => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snapshot) => {
                    if (snapshot.exists()) {
                        uData = snapshot.data();
                        userBal = uData.balance || 0;
                        document.getElementById('currentBal').innerText = "$" + userBal.toFixed(2);
                    }
                });
            } else { window.location.href = "login.html"; }
        });

        function showErrorAlert(message) {
            Swal.fire({
                title: 'Cilad baa dhacday!',
                text: message,
                icon: 'error',
                background: '#111827',
                color: '#ffffff',
                confirmButtonColor: '#EF4444',
                customClass: { popup: 'border border-gray-800 rounded-2xl' }
            });
        }

        document.getElementById('withForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('amount').value);
            const method = document.getElementById('method').value;
            const phone = document.getElementById('phone').value;

            if (method === "EVC Plus" && !phone.startsWith("61")) return showErrorAlert("Geli nambar Hormuud ah oo ku bilaawda 61!");
            if (method === "eDahab" && !phone.startsWith("62")) return showErrorAlert("Geli nambar Somtel ah oo ku bilaawda 62!");
            if (amt > userBal) return showErrorAlert("Haraagaaga xisaabta (Balance) kuguma filna!");
            if (amt < 10) return showErrorAlert("Ugu yaraan xaddiga la bixiddu waa $10.");

            document.getElementById('withBtn').disabled = true;

            try {
                await updateDoc(doc(db, "users", auth.currentUser.uid), {
                    balance: userBal - amt
                });

                await addDoc(collection(db, "transactions"), {
                    userId: auth.currentUser.uid,
                    userName: uData.name || "User",
                    amount: amt,
                    method: method,
                    txid: phone, 
                    type: "Withdraw",
                    status: "Pending",
                    date: serverTimestamp()
                });

                Swal.fire({
                    title: 'Waa la gudbiyay!',
                    text: 'Codsigaaga lacag kala bixitaanka waa la diray.',
                    icon: 'success',
                    background: '#111827',
                    color: '#ffffff',
                    confirmButtonColor: '#EF4444',
                    customClass: { popup: 'border border-gray-800 rounded-2xl' }
                }).then(() => { window.location.href = "dashboard.html"; });

            } catch (err) { 
                showErrorAlert(err.message); 
                document.getElementById('withBtn').disabled = false;
            }
        });
    </script>
</body>
</html>

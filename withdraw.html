<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #ff4757;
            --primary-glow: rgba(255, 71, 87, 0.3);
            --bg: #030303;
            --card: #0d0d0d;
            --border: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* NEON TOP HEADER */
        header {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            background: linear-gradient(to bottom, #000, transparent);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 20px; font-weight: 600; flex-grow: 1; text-align: center; margin-right: 30px; letter-spacing: 1px; }
        .back-btn { 
            width: 40px; height: 40px; 
            background: var(--glass); 
            border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; border: 1px solid var(--border);
        }

        .container { padding: 0 20px; }

        /* BALANCE CARD (GLOWING) */
        .balance-card {
            background: var(--card);
            padding: 35px 20px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid var(--border);
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .balance-card::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary);
        }
        .balance-card p { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 2px; }
        .balance-card h2 { 
            font-family: 'Orbitron', sans-serif; font-size: 38px; color: #fff; 
            margin-top: 10px; text-shadow: 0 0 20px var(--primary-glow);
        }

        /* MODERN WITHDRAW FORM */
        .withdraw-box {
            background: var(--glass);
            border-radius: 30px;
            padding: 30px 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 10px; padding-left: 5px; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i { 
            position: absolute; left: 18px; 
            color: var(--primary); font-size: 18px; 
            opacity: 0.8;
        }
        
        .input-wrapper select, .input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 50px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 18px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: rgba(255, 71, 87, 0.05);
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.1);
        }

        /* CUSTOM BUTTON */
        .btn-withdraw {
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            border: none;
            color: #fff;
            font-weight: 700;
            border-radius: 20px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 25px var(--primary-glow);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-withdraw:active { transform: scale(0.96); }

        .info-note {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.02);
            padding: 18px;
            border-radius: 20px;
            border-left: 4px solid var(--primary);
            font-size: 11px;
            color: #888;
            line-height: 1.8;
        }
        .info-note b { color: #ddd; }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item { color: #444; text-decoration: none; text-align: center; font-size: 10px; transition: 0.3s; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }
        .nav-item.active { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>Withdrawal</h1>
    </header>

    <div class="container">
        <div class="balance-card">
            <p>Ready to Withdraw</p>
            <h2 id="userBalance">$0.00</h2>
        </div>

        <div class="withdraw-box">
            <form id="withdrawForm">
                <div class="input-group">
                    <label>Payment Method</label>
                    <div class="input-wrapper">
                        <i class="fas fa-wallet"></i>
                        <select id="method">
                            <option value="EVC Plus">EVC Plus (Hormuud)</option>
                            <option value="eDahab">eDahab (Somtel)</option>
                            <option value="Premier Wallet">Premier Wallet</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Amount to Withdraw</label>
                    <div class="input-wrapper">
                        <i class="fas fa-dollar-sign"></i>
                        <input type="number" id="withdrawAmount" placeholder="Minimum $10.00" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Mobile Number / Account</label>
                    <div class="input-wrapper">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="tel" id="phoneNum" placeholder="e.g. 61XXXXXXX" required>
                    </div>
                </div>

                <button type="submit" class="btn-withdraw" id="withBtn">
                    <span>Confirm Withdrawal</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <div class="info-note">
                <i class="fas fa-shield-alt" style="color: var(--primary); margin-right: 5px;"></i> 
                <b>Security Note:</b> Lacag bixintu waxay qaadanaysaa <b>1-12 saacadood</b> si loo hubiyo amniga koontadaada. Hubi in macluumaadkaagu sax yahay.
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="invest.html" class="nav-item"><i class="fas fa-rocket"></i><span>Invest</span></a>
        <a href="deposit.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>Deposit</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i><span>Profile</span></a>
    </div>

<script>
    // Config-gaagu sidii uu ahaa waaye
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userBal = 0;
    let userData = {};

    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    userBal = userData.balance || 0;
                    document.getElementById('userBalance').innerText = "$" + userBal.toLocaleString(undefined, {minimumFractionDigits: 2});
                }
            });
        } else {
            window.location.href = "log.html";
        }
    });

    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amt = parseFloat(document.getElementById('withdrawAmount').value);
        const phone = document.getElementById('phoneNum').value;
        const method = document.getElementById('method').value;
        const btn = document.getElementById('withBtn');

        if (amt < 10) return alert("Minimum withdrawal is $10");
        if (amt > userBal) return alert("Insufficient balance!");
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        btn.disabled = true;

        try {
            const user = auth.currentUser;
            
            // Batch update for security
            const batch = db.batch();
            const userRef = db.collection("users").doc(user.uid);
            const transRef = db.collection("transactions").doc();

            batch.update(userRef, { balance: firebase.firestore.FieldValue.increment(-amt) });
            batch.set(transRef, {
                userId: user.uid,
                userName: userData.fullName || "Unknown",
                amount: amt,
                method: method,
                txid: phone,
                type: "Withdraw",
                status: "Pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            await batch.commit();

            alert("Withdrawal request sent successfully!");
            window.location.href = "dashboard.html";
        } catch (err) {
            alert("Error: " + err.message);
            btn.innerHTML = '<span>Confirm Withdrawal</span> <i class="fas fa-paper-plane"></i>';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>

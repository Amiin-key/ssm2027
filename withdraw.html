<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #ff4757; /* Midabka guduudka ah ee Withdraw */
            --primary-glow: rgba(255, 71, 87, 0.2);
            --bg: #050505;
            --card: #0f0f0f;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; }

        /* HEADER */
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 18px; font-weight: 600; flex-grow: 1; text-align: center; margin-right: 30px; }
        .back-btn { color: #fff; text-decoration: none; font-size: 20px; }

        .container { padding: 20px; }

        /* BALANCE CARD */
        .balance-card {
            background: linear-gradient(145deg, #111, #080808);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            border: 1px solid var(--border);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        .balance-card::after {
            content: ''; position: absolute; top: -20px; right: -20px; 
            width: 80px; height: 80px; background: var(--primary-glow); filter: blur(30px);
        }
        .balance-card p { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .balance-card h2 { font-family: 'Orbitron', sans-serif; font-size: 32px; color: #fff; margin-top: 10px; }

        /* WITHDRAW FORM */
        .withdraw-box {
            background: var(--card);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid var(--border);
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; margin-left: 5px; }
        
        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-field i { position: absolute; left: 15px; color: var(--primary); font-size: 18px; }
        .input-field select, .input-field input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 15px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            appearance: none;
        }
        .input-field input:focus { border-color: var(--primary); }

        .btn-withdraw {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            border: none;
            color: #fff;
            font-weight: 700;
            border-radius: 15px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .info-note {
            margin-top: 20px;
            background: rgba(255, 71, 87, 0.05);
            padding: 15px;
            border-radius: 15px;
            border: 1px dashed var(--primary);
            font-size: 11px;
            color: #aaa;
            line-height: 1.6;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }
        .nav-item { color: #555; text-decoration: none; text-align: center; font-size: 10px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: #00ff88; } /* Dashboard color */
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h1>Withdraw Funds</h1>
    </header>

    <div class="container">
        <div class="balance-card">
            <p>Available Balance</p>
            <h2 id="userBalance">$0.00</h2>
        </div>

        <div class="withdraw-box">
            <form id="withdrawForm">
                <div class="input-group">
                    <label>Select Method</label>
                    <div class="input-field">
                        <i class="fas fa-university"></i>
                        <select id="method">
                            <option value="EVC Plus">EVC Plus (Hormuud)</option>
                            <option value="eDahab">eDahab (Somtel)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Amount ($)</label>
                    <div class="input-field">
                        <i class="fas fa-money-bill-wave"></i>
                        <input type="number" id="withdrawAmount" placeholder="Min $10.00" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Receiver Phone Number</label>
                    <div class="input-field">
                        <i class="fas fa-phone-alt"></i>
                        <input type="tel" id="phoneNum" placeholder="61XXXXXXX" required>
                    </div>
                </div>

                <button type="submit" class="btn-withdraw" id="withBtn">Request Withdrawal</button>
            </form>

            <div class="info-note">
                <i class="fas fa-info-circle"></i> 
                Lacag bixintu waxay qaadanaysaa 1 ilaa 12 saacadood. Hubi in nambarkaagu sax yahay ka hor intaadan dirin codsiga.
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="invest.html" class="nav-item">
            <i class="fas fa-rocket"></i>
            <span>Invest</span>
        </a>
        <a href="deposit.html" class="nav-item">
            <i class="fas fa-plus-circle"></i>
            <span>Deposit</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userBal = 0;
    let userData = {};

    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    userBal = userData.balance || 0;
                    document.getElementById('userBalance').innerText = "$" + userBal.toFixed(2);
                }
            });
        } else {
            window.location.href = "log.html";
        }
    });

    document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amt = parseFloat(document.getElementById('withdrawAmount').value);
        const phone = document.getElementById('phoneNum').value;
        const method = document.getElementById('method').value;
        const btn = document.getElementById('withBtn');

        if (amt < 10) return alert("Lacagta ugu yar waa $10");
        if (amt > userBal) return alert("Haraagaagu kuguma filna!");
        if (phone.length < 9) return alert("Fadlan geli nambar sax ah!");

        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const user = auth.currentUser;
            // 1. Minus from balance
            await db.collection("users").doc(user.uid).update({
                balance: firebase.firestore.FieldValue.increment(-amt)
            });

            // 2. Add to transactions
            await db.collection("transactions").add({
                userId: user.uid,
                userName: userData.fullName || "User",
                amount: amt,
                method: method,
                txid: phone,
                type: "Withdraw",
                status: "Pending",
                date: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Codisigii waa la diray! Waa lagu xaqiijin doonaa dhowaan.");
            window.location.href = "dashboard.html";
        } catch (err) {
            alert("Cilad: " + err.message);
            btn.innerText = "Request Withdrawal";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>

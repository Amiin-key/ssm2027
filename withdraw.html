<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM 2027 | Withdraw</title>
    
    <!-- Icons & Firebase Scripts -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root { --primary: #ff4757; --bg: #050505; --card: #0f0f0f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: white; padding: 20px; }
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { color: #888; text-decoration: none; font-size: 20px; margin-right: 15px; }

        .card { background: var(--card); padding: 30px; border-radius: 25px; border: 1px solid #222; max-width: 400px; margin: auto; text-align: center; }
        .balance-display { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #222; }
        
        input, select { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 12px; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .btn-withdraw { width: 100%; padding: 15px; background: var(--primary); border: none; color: white; font-weight: 900; border-radius: 12px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-withdraw:disabled { background: #333; cursor: not-allowed; }
        
        .footer-link { display:block; margin-top:20px; color:#555; text-decoration:none; font-size:13px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h3 style="font-size: 18px;">Lacag la bixid</h3>
    </div>

    <div class="card">
        <h2 style="color:var(--primary); margin-bottom:20px;">Kala Bax Lacag</h2>
        
        <div class="balance-display">
            <p style="font-size:12px; color:#666;">Balance-kaaga hadda</p>
            <h2 id="currentBal">$0.00</h2>
        </div>

        <form id="withForm">
            <input type="number" id="amount" placeholder="Cadadka lacagta ($)" required>
            
            <select id="method" onchange="updatePlaceholder()">
                <option value="EVC Plus">EVC Plus (Hormuud)</option>
                <option value="eDahab">eDahab (Somtel)</option>
            </select>
            
            <input type="tel" id="phone" placeholder="Lambarka EVC (61...)" required>
            
            <button type="submit" class="btn-withdraw" id="withBtn">CODSO LACAG KALA BAX</button>
        </form>
        
        <a href="index.html" class="footer-link">Ku laabo Dashboard-ka</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let userBal = 0;
        let userData = {};

        // Bedel placeholder-ka marka la doorto method kale
        function updatePlaceholder() {
            const method = document.getElementById('method').value;
            const phoneInput = document.getElementById('phone');
            if (method === "EVC Plus") {
                phoneInput.placeholder = "Lambarka EVC (61...)";
            } else {
                phoneInput.placeholder = "Lambarka eDahab (62...)";
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        userData = doc.data();
                        userBal = userData.balance || 0;
                        document.getElementById('currentBal').innerText = "$" + userBal.toFixed(2);
                    }
                });
            } else { 
                window.location.href = "log.html"; 
            }
        });

        document.getElementById('withForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('amount').value);
            const method = document.getElementById('method').value;
            const phone = document.getElementById('phone').value;
            const btn = document.getElementById('withBtn');

            // --- VALIDATION LAMBARKA ---
            if (method === "EVC Plus" && !phone.startsWith("61")) {
                return alert("Fadlan geli lambar Hormuud ah oo ku bilaabanaya 61");
            }
            if (method === "eDahab" && !phone.startsWith("62")) {
                return alert("Fadlan geli lambar Somtel ah oo ku bilaabanaya 62");
            }
            if (phone.length < 9) {
                return alert("Lambarkaagu waa inuu ka koobnaadaa ugu yaraan 9 xaraf");
            }
            // ---------------------------

            if (amt > userBal) return alert("Balance-kaagu kuguma filna!");
            if (amt < 10) return alert("Lacagta ugu yar ee la bixi karo waa $10");

            btn.innerText = "WAA LA DIRAYAA...";
            btn.disabled = true;

            try {
                await db.collection("users").doc(auth.currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(-amt)
                });

                await db.collection("transactions").add({
                    userId: auth.currentUser.uid,
                    userName: userData.fullName || "User",
                    amount: amt,
                    method: method,
                    txid: phone, 
                    type: "Withdraw",
                    status: "Pending",
                    date: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Codsigaaga waa la diray! Waxaa laguugu soo jawaabi doonaa dhowaan.");
                window.location.href = "index.html";

            } catch (err) { 
                alert("Cilad: " + err.message); 
                btn.innerText = "CODSO LACAG KALA BAX";
                btn.disabled = false; 
            }
        });
    </script>
</body>
</html>

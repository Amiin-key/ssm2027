<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Withdraw</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88;
            --danger: #ff3e3e;
            --bg: #050505;
            --card: #111;
            --border: rgba(255,255,255,0.08);
            --text-dim: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding-bottom: 100px; }

        /* Header */
        .page-header {
            padding: 25px; display: flex; align-items: center; gap: 20px;
        }
        .back-btn { 
            width: 45px; height: 45px; background: var(--card); border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);
            color: #fff; text-decoration: none;
        }

        /* Status Card */
        .withdraw-container { padding: 0 20px; }
        .balance-preview {
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border-radius: 30px; padding: 30px; border: 1px solid var(--border);
            text-align: center; margin-bottom: 25px;
        }
        .label-sm { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
        .current-bal { font-family: 'Orbitron'; font-size: 1.8rem; color: var(--primary); margin-top: 10px; }

        /* Form Controls */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); margin: 0 0 10px 10px; letter-spacing: 1px; }
        
        .modern-input {
            width: 100%; background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; color: #fff; outline: none;
            font-size: 1rem; transition: 0.3s;
        }
        .modern-input:focus { border-color: var(--danger); background: rgba(255,62,62,0.02); }

        .withdraw-btn {
            width: 100%; background: var(--danger); color: #fff; border: none;
            border-radius: 20px; padding: 22px; font-weight: 800; font-family: 'Poppins';
            font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; margin-top: 10px; box-shadow: 0 10px 20px rgba(255,62,62,0.15);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .withdraw-btn:disabled { background: #333; cursor: not-allowed; box-shadow: none; }
        .withdraw-btn:active { transform: scale(0.98); opacity: 0.9; }

        /* Security Info */
        .info-box {
            margin-top: 25px; padding: 15px; border-radius: 15px;
            background: rgba(255,255,255,0.02); display: flex; gap: 15px; align-items: center;
        }
        .info-box i { color: #555; font-size: 1.2rem; }
        .info-box p { font-size: 0.75rem; color: #555; line-height: 1.4; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: rgba(15,15,15,0.9); backdrop-filter: blur(20px);
            height: 70px; border-radius: 25px; border: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .nav-link { color: var(--text-dim); font-size: 1.4rem; transition: 0.3s; }
        .nav-link.active { color: var(--danger); transform: translateY(-5px); }

        /* Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center;
            align-items: center; z-index: 1000; flex-direction: column; gap: 15px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--danger);"></i>
        <p style="font-size: 0.8rem; letter-spacing: 1px;">Processing...</p>
    </div>

    <div class="page-header">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left-long"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 1rem; letter-spacing: 1px;">Withdraw</h2>
    </div>

    <div class="withdraw-container">
        <div class="balance-preview">
            <span class="label-sm">Withdrawal Balance</span>
            <div class="current-bal" id="userBalance">$0.00</div>
        </div>

        <div class="input-group">
            <label>Amount (USD)</label>
            <input type="number" class="modern-input" placeholder="Min: $1.00" id="wAmount">
        </div>

        <div class="input-group">
            <label>EVC Plus / Premier Wallet</label>
            <input type="number" class="modern-input" placeholder="61XXXXXXX" id="wPhone">
        </div>

        <button class="withdraw-btn" id="btnAction">
            Withdraw Now <i class="fa-solid fa-money-bill-transfer"></i>
        </button>

        <div class="info-box">
            <i class="fa-solid fa-shield-halved"></i>
            <p>Lacagtaadu waxay ku soo dhacaysaa mudo 24 saac gudahood ah ka dib marka la xaqiijiyo xogtaada.</p>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house-chimney-window"></i></a>
        <a href="invest.html" class="nav-link"><i class="fa-solid fa-rocket"></i></a>
        <a href="withdraw.html" class="nav-link active"><i class="fa-solid fa-money-bill-transfer"></i></a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user-gear"></i></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.firebasestorage.app",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb",
            measurementId: "G-HS16FERS90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentBalance = 0;

        // 1. Hubi User-ka iyo Balance-kiisa dhabta ah
        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snapshot) => {
                    if (snapshot.exists()) {
                        currentBalance = snapshot.data().balance || 0;
                        document.getElementById('userBalance').innerText = "$" + currentBalance.toFixed(2);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        // 2. Shaqada Lacag Labaxashada
        document.getElementById('btnAction').addEventListener('click', async () => {
            const amountInput = document.getElementById('wAmount').value;
            const phoneInput = document.getElementById('wPhone').value;
            const loader = document.getElementById('loader');

            if (!amountInput || !phoneInput) {
                alert("Fadlan buuxi dhammaan meelaha banaan!");
                return;
            }

            const amount = parseFloat(amountInput);

            if (amount < 1) {
                alert("Lacagta ugu yar ee la bixi karo waa $1.00");
                return;
            }

            if (amount > currentBalance) {
                alert("Haraagaagu kuguma filna!");
                return;
            }

            if (confirm(`Ma hubtaa inaad $${amount} u soo kacayso nambarka ${phoneInput}?`)) {
                loader.style.display = 'flex';
                
                try {
                    const user = auth.currentUser;
                    const userRef = doc(db, "users", user.uid);

                    // A. Ka jar lacagta haraaga isticmaalaha isla markiiba
                    await updateDoc(userRef, {
                        balance: increment(-amount)
                    });

                    // B. Diiwaangeli codsiga (Withdrawal Request)
                    await addDoc(collection(db, "withdrawals"), {
                        userId: user.uid,
                        userEmail: user.email,
                        amount: amount,
                        phone: phoneInput,
                        status: "Pending", // Maamulaha ayaa "Approved" ka dhigi doona
                        timestamp: Date.now(),
                        method: "EVC Plus"
                    });

                    alert("Codsigaaga waa la helay! Waxaa laguugu soo diri doonaa 24 saac gudahood.");
                    document.getElementById('wAmount').value = "";
                    document.getElementById('wPhone').value = "";
                    
                } catch (error) {
                    alert("Khalad baa dhacay: " + error.message);
                } finally {
                    loader.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>

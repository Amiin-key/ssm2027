<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Maalgashi (Invest)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-500"><i class="fa-solid fa-chart-line mr-2"></i>SSM INVEST</h1>
        <a href="dashboard.html" class="text-sm bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-xl border border-gray-700 transition-all flex items-center">
            <i class="fa-solid fa-arrow-left mr-2"></i> Dashboard
        </a>
    </nav>

    <main class="max-w-md mx-auto px-4 py-8">
        <h2 class="text-xl font-bold mb-6 flex items-center text-blue-400">
            <i class="fa-solid fa-layer-group mr-2"></i> Dooro Qorshaha Maalgashiga
        </h2>
        
        <div class="grid grid-cols-1 gap-6 mb-10">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="p-3 bg-blue-500/10 text-blue-500 rounded-xl text-xl"><i class="fa-solid fa-seedling"></i></div>
                    <h3 class="text-lg font-bold">Qorshaha Starter</h3>
                </div>
                <p class="text-3xl font-black text-white">$50</p>
                <p class="text-sm text-gray-400 mt-2"><i class="fa-solid fa-percent text-green-500 mr-1"></i> Faa'iido: 10% / 5 Maalmood</p>
                <button onclick="submitInvestment('Starter', 50)" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 py-2.5 rounded-xl font-bold transition-all">Maalgashi Hadda</button>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="p-3 bg-purple-500/10 text-purple-500 rounded-xl text-xl"><i class="fa-solid fa-gem"></i></div>
                    <h3 class="text-lg font-bold">Qorshaha Premium</h3>
                </div>
                <p class="text-3xl font-black text-white">$500</p>
                <p class="text-sm text-gray-400 mt-2"><i class="fa-solid fa-percent text-green-500 mr-1"></i> Faa'iido: 25% / 10 Maalmood</p>
                <button onclick="submitInvestment('Premium', 500)" class="w-full mt-6 bg-purple-600 hover:bg-purple-700 py-2.5 rounded-xl font-bold transition-all">Maalgashi Hadda</button>
            </div>
        </div>

        <h2 class="text-xl font-bold mb-4 flex items-center text-gray-400">
            <i class="fa-solid fa-clock-rotate-left mr-2 text-blue-500"></i> Taariikhdaada
        </h2>
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4 space-y-2" id="investHistoryList">
            Loading history...
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { doc, getDoc, updateDoc, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        let currentBalance = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                // Live tracking balance
                onSnapshot(doc(db, "users", user.uid), (snapshot) => {
                    if(snapshot.exists()) currentBalance = snapshot.data().balance || 0;
                });
                // Load investment history
                const q = query(collection(db, "investments"), where("userId", "==", user.uid));
                onSnapshot(q, (snapshot) => {
                    const list = document.getElementById('investHistoryList');
                    list.innerHTML = snapshot.empty ? "<p class='text-xs text-gray-500'>Ma jiro maalgashi aad samaysay.</p>" : "";
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        list.innerHTML += `<div class="flex justify-between items-center bg-gray-950 p-3 rounded-xl border border-gray-800 text-xs">
                            <div><p class="font-bold">${d.plan} Plan</p><p class="text-gray-500">Amount: $${d.amount}</p></div>
                            <span class="${d.status==='Active'?'text-yellow-500':'text-green-500'} font-bold">${d.status}</span>
                        </div>`;
                    });
                });
            } else { window.location.href = "login.html"; }
        });

        window.submitInvestment = async function(planName, amt) {
            const user = auth.currentUser;
            if(!user) return;
            if(currentBalance < amt) {
                return Swal.fire({ icon: 'error', title: 'Haraagaaga ku maku filna!', text: `Qorshahan wuxuu u baahanyahay $${amt}` });
            }

            try {
                await updateDoc(doc(db, "users", user.uid), { balance: currentBalance - amt });
                await addDoc(collection(db, "investments"), {
                    userId: user.uid,
                    plan: planName,
                    amount: amt,
                    status: "Active",
                    profitClaimed: false,
                    date: serverTimestamp()
                });
                Swal.fire({ icon: 'success', title: 'Maalgashiga waa lagu guuleystay!', text: `Waxaad si guul leh u kicisay ${planName} plan.` });
            } catch(e) { Swal.fire({ icon: 'error', title: 'Cilad baa dhacday', text: e.message }); }
        }
    </script>
</body>
</html>

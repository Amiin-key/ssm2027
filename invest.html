<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Investment Plans</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; padding-bottom: 50px; }

        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-nav a { color: #fff; text-decoration: none; width: 40px; height: 40px; background: var(--card); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #222; }

        .header-section { margin-bottom: 30px; }
        .header-section h2 { font-family: 'Orbitron'; font-size: 1.2rem; letter-spacing: 1px; }
        .header-section p { font-size: 0.8rem; color: #666; margin-top: 5px; }

        .balance-info { background: linear-gradient(135deg, #111, #000); padding: 20px; border-radius: 20px; border: 1px solid #222; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .balance-info small { color: #888; font-size: 0.7rem; text-transform: uppercase; }
        .balance-info h3 { color: var(--primary); font-family: 'Orbitron'; font-size: 1.2rem; }

        /* Investment Cards */
        .plan-card { background: var(--card); border-radius: 25px; border: 1px solid #222; padding: 25px; margin-bottom: 20px; position: relative; overflow: hidden; transition: 0.3s; }
        .plan-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .plan-card.gold::before { background: var(--accent); }

        .plan-name { font-family: 'Orbitron'; font-size: 1rem; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .plan-roi { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .plan-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; border-top: 1px solid #222; padding-top: 15px; }
        .detail-item { font-size: 0.75rem; color: #888; }
        .detail-item span { display: block; color: #fff; font-weight: 600; margin-top: 2px; }

        .btn-invest { width: 100%; padding: 15px; border: none; border-radius: 15px; font-family: 'Orbitron'; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: 0.3s; background: var(--primary); color: #000; }
        .btn-invest:active { transform: scale(0.96); }
        .plan-card.gold .btn-invest { background: var(--accent); }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary);"></i>
        <p style="margin-top: 15px; font-size: 0.8rem;">Processing Investment...</p>
    </div>

    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 1rem;">INVEST PLANS</h2>
    </div>

    <div class="balance-info">
        <div>
            <small>Available Balance</small>
            <h3 id="userBalance">$0.00</h3>
        </div>
        <i class="fa-solid fa-wallet" style="font-size: 1.5rem; color: #222;"></i>
    </div>

    <div class="plan-card">
        <div class="plan-name">BASIC PLAN <span style="color: var(--primary);">Daily</span></div>
        <div class="plan-roi">5% <small style="font-size: 0.8rem; font-weight: normal;">Every 24h</small></div>
        <div class="plan-details">
            <div class="detail-item">Min Invest <span>$10.00</span></div>
            <div class="detail-item">Max Invest <span>$499.00</span></div>
            <div class="detail-item">Duration <span>30 Days</span></div>
            <div class="detail-item">Total Return <span>150%</span></div>
        </div>
        <button class="btn-invest" onclick="startInvest('Basic', 10, 499)">INVEST NOW</button>
    </div>

    <div class="plan-card gold">
        <div class="plan-name" style="color: var(--accent);">PREMIUM GOLD <span style="color: var(--accent);">Daily</span></div>
        <div class="plan-roi">8% <small style="font-size: 0.8rem; font-weight: normal;">Every 24h</small></div>
        <div class="plan-details">
            <div class="detail-item">Min Invest <span>$500.00</span></div>
            <div class="detail-item">Max Invest <span>$5,000.00</span></div>
            <div class="detail-item">Duration <span>30 Days</span></div>
            <div class="detail-item">Total Return <span>240%</span></div>
        </div>
        <button class="btn-invest" onclick="startInvest('Gold', 500, 5000)">INVEST NOW</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentBalance = 0;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snapshot) => {
                    if (snapshot.exists()) {
                        currentBalance = snapshot.data().balance || 0;
                        document.getElementById('userBalance').innerText = "$" + currentBalance.toFixed(2);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        window.startInvest = async function(planName, min, max) {
            const amount = prompt(`Geli cadadka aad rabto inaad geliso ${planName} ($${min} - $${max}):`);
            
            if (!amount || isNaN(amount)) return;
            const investAmount = parseFloat(amount);

            if (investAmount < min || investAmount > max) {
                alert(`Khalad: Cadadku waa inuu u dhexeeyaa $${min} iyo $${max}`);
                return;
            }

            if (investAmount > currentBalance) {
                alert("Haraagaagu kuguma filna. Fadlan lacag dhigo marka hore.");
                return;
            }

            if (confirm(`Ma hubtaa inaad $${investAmount} ku maalgeliso qorshaha ${planName}?`)) {
                document.getElementById('loading-overlay').style.display = 'flex';
                
                try {
                    const userRef = doc(db, "users", auth.currentUser.uid);
                    
                    // 1. Ka jar lacagta haraaga
                    await updateDoc(userRef, {
                        balance: increment(-investAmount)
                    });

                    // 2. Diiwaangeli maalgashiga (Active Investment)
                    await addDoc(collection(db, "investments"), {
                        userId: auth.currentUser.uid,
                        plan: planName,
                        amount: investAmount,
                        status: "Active",
                        timestamp: Date.now(),
                        nextReturn: Date.now() + (24 * 60 * 60 * 1000) // 24 saac ka dib
                    });

                    alert(`Hambalyo! Maalgashigaaga ${planName} waa bilaabmay.`);
                    window.location.href = "dashboard.html";
                } catch (error) {
                    alert("Khalad baa dhacay: " + error.message);
                } finally {
                    document.getElementById('loading-overlay').style.display = 'none';
                }
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM 2027 | Is-diiwaangali</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reg-card { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; border: 1px solid #222; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 12px; outline: none; }
        .btn-reg { width: 100%; padding: 15px; background: var(--primary); border: none; color: #000; font-weight: 900; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <div class="reg-card">
        <h2 style="color: var(--primary); margin-bottom: 20px; font-weight: 900;">SSM INVEST</h2>
        <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Fadlan buuxi xogtaada hoose</p>
        
        <input type="text" id="fullName" placeholder="Magaca oo buuxa">
        <input type="email" id="email" placeholder="Email-kaaga">
        <input type="password" id="password" placeholder="Password cusub">
        
        <button class="btn-reg" id="regBtn">ABUUR ACCOUNT</button>
        <div id="status"></div>
        
        <p style="margin-top: 20px; font-size: 12px;">Haysatid Account? <a href="log.html" style="color:var(--primary); text-decoration: none;">Soo gal</a></p>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();

    document.getElementById('regBtn').onclick = async () => {
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('regBtn');

        if(!name || !email || !pass) {
            alert("Fadlan dhammaan meelaha buuxi!");
            return;
        }

        btn.innerText = "WAA LA ABUURAYAA...";
        btn.disabled = true;

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            const user = userCredential.user;
            
            await db.collection("users").doc(user.uid).set({
                fullName: name,
                email: email,
                balance: 0,
                role: "user",
                activeInvestments: [],
                createdAt: new Date().toISOString()
            });

            status.style.color = "#00ff88";
            status.innerText = "Guul! Hadda ayaa laguu gudbinayaa...";

            setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
        } catch (err) {
            btn.innerText = "ABUUR ACCOUNT";
            btn.disabled = false;
            status.style.color = "#ff4757";
            status.innerText = "Cilad: " + err.message;
        }
    };
</script>
</body>
</html>

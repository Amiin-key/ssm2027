<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Password Recovery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00ff88;
            --bg: #050505;
            --card: #111;
            --border: rgba(255,255,255,0.08);
            --text-dim: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .recovery-container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 45px 30px;
            border-radius: 35px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .icon-circle {
            width: 80px; height: 80px; 
            background: rgba(0,255,136,0.05);
            border: 1px solid rgba(0,255,136,0.2);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0 auto 25px; 
            color: var(--primary); 
            font-size: 2rem;
        }

        h2 { 
            font-family: 'Orbitron'; 
            font-size: 1.2rem; 
            margin-bottom: 12px; 
            letter-spacing: 1px; 
        }

        p { 
            font-size: 0.85rem; 
            color: var(--text-dim); 
            margin-bottom: 30px; 
            line-height: 1.6; 
        }

        .input-group { 
            position: relative; 
            margin-bottom: 25px; 
            text-align: left; 
        }

        .input-group i { 
            position: absolute; 
            left: 18px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--primary); 
            font-size: 1rem; 
        }

        .input-group input {
            width: 100%; 
            background: #000; 
            border: 1px solid var(--border);
            padding: 18px 15px 18px 50px; 
            border-radius: 18px; 
            color: #fff;
            font-family: 'Poppins'; 
            font-size: 0.95rem; 
            outline: none; 
            transition: 0.3s;
        }

        .input-group input:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 15px rgba(0,255,136,0.1); 
        }

        .btn-reset {
            width: 100%; 
            background: var(--primary); 
            color: #000; 
            border: none;
            padding: 18px; 
            border-radius: 18px; 
            font-family: 'Orbitron';
            font-weight: 800; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .btn-reset:active { transform: scale(0.96); }
        .btn-reset:disabled { background: #333; color: #666; cursor: not-allowed; }

        .back-link { 
            display: inline-block; 
            margin-top: 30px; 
            color: var(--text-dim); 
            text-decoration: none; 
            font-size: 0.85rem; 
            transition: 0.3s; 
        }

        .back-link:hover { color: var(--primary); }

        #message { 
            margin-top: 20px; 
            font-size: 0.85rem; 
            min-height: 20px; 
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="recovery-container">
        <div class="icon-circle">
            <i class="fa-solid fa-key"></i>
        </div>
        <h2>SOO CELIN</h2>
        <p>Geli email-kaaga si aan kuugu soo dirno link aad dib ugu dajiso sirtaada (Password-ka).</p>

        <form id="recoveryForm">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Email-kaaga" required autocomplete="email">
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">SEND RESET LINK</button>
        </form>

        <div id="message"></div>

        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Dib ugu laabo Login
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const recoveryForm = document.getElementById('recoveryForm');
        const messageDiv = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        recoveryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            resetBtn.disabled = true;
            resetBtn.innerText = "Diraaya...";

            // 2. Firebase Reset Password Function
            sendPasswordResetEmail(auth, email)
                .then(() => {
                    messageDiv.style.background = "rgba(0, 255, 136, 0.1)";
                    messageDiv.style.color = "#00ff88";
                    messageDiv.innerText = "Link-ga dib u dajinta waa la soo diray! Hubi Email-kaaga.";
                    resetBtn.innerText = "LA DIRAY";
                    resetBtn.style.display = "none";
                })
                .catch((error) => {
                    messageDiv.style.background = "rgba(255, 75, 75, 0.1)";
                    messageDiv.style.color = "#ff4b4b";
                    
                    const errorCode = error.code;
                    if (errorCode === 'auth/user-not-found') {
                        messageDiv.innerText = "Email-kan laguma helin nidaamka.";
                    } else if (errorCode === 'auth/invalid-email') {
                        messageDiv.innerText = "Email-ka aad gelisay ma ahan mid sax ah.";
                    } else {
                        messageDiv.innerText = "Khalad baa dhacay. Fadlan mar kale isku day.";
                    }
                    
                    resetBtn.disabled = false;
                    resetBtn.innerText = "SEND RESET LINK";
                });
        });
    </script>
</body>
</html>

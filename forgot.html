<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Password Recovery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00ff88;
            --bg: #050505;
            --card: #111;
            --border: rgba(255,255,255,0.08);
            --text-dim: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
        }

        .recovery-container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 40px 25px;
            border-radius: 30px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        /* Icon-ka Weyn ee kore */
        .icon-circle {
            width: 70px; height: 70px; 
            background: rgba(0,255,136,0.03);
            border: 1px solid rgba(0,255,136,0.15);
            border-radius: 22px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0 auto 20px; 
            color: var(--primary); 
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(0,255,136,0.05);
        }

        h2 { 
            font-family: 'Orbitron'; 
            font-size: 1.1rem; 
            margin-bottom: 10px; 
            letter-spacing: 1.5px; 
            color: #fff;
        }

        p { 
            font-size: 0.8rem; 
            color: var(--text-dim); 
            margin-bottom: 30px; 
            line-height: 1.6; 
            padding: 0 10px;
        }

        /* Input Group qurxoon */
        .input-group { 
            position: relative; 
            margin-bottom: 20px; 
        }

        .input-group i { 
            position: absolute; 
            left: 18px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--primary); 
            font-size: 1rem;
            filter: drop-shadow(0 0 5px rgba(0,255,136,0.3));
        }

        .input-group input {
            width: 100%; 
            background: #000; 
            border: 1px solid var(--border);
            padding: 16px 15px 16px 50px; 
            border-radius: 14px; 
            color: #fff;
            font-family: 'Poppins'; 
            font-size: 0.9rem; 
            outline: none; 
            transition: 0.3s;
        }

        .input-group input:focus { 
            border-color: var(--primary); 
            background: rgba(0,255,136,0.01);
        }

        /* Button-ka Submit */
        .btn-reset {
            width: 100%; 
            background: var(--primary); 
            color: #000; 
            border: none;
            padding: 16px; 
            border-radius: 14px; 
            font-family: 'Orbitron';
            font-weight: 700; 
            font-size: 0.85rem; 
            cursor: pointer; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,255,136,0.2);
        }

        .btn-reset:active { transform: scale(0.97); }
        .btn-reset:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }

        .back-link { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 30px; 
            color: var(--text-dim); 
            text-decoration: none; 
            font-size: 0.8rem; 
            transition: 0.3s; 
        }

        .back-link:hover { color: var(--primary); }

        #message { 
            margin-top: 15px; 
            font-size: 0.75rem; 
            padding: 12px;
            border-radius: 10px;
            display: none; /* Bilowga qari */
        }
    </style>
</head>
<body>

    <div class="recovery-container">
        <!-- Icon kore oo cusub -->
        <div class="icon-circle">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        
        <h2>RECOVER PASSWORD</h2>
        <p>Geli email-kaaga si aan kuugu soo dirno link aad dib ugu dajiso sirtaada.</p>

        <form id="recoveryForm">
            <div class="input-group">
                <i class="fa-solid fa-envelope-open-text"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <i class="fa-solid fa-paper-plane"></i> SEND RESET LINK
            </button>
        </form>

        <div id="message"></div>

        <a href="login.html" class="back-link">
            <i class="fa-solid fa-chevron-left"></i> Dib ugu laabo Login
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const recoveryForm = document.getElementById('recoveryForm');
        const messageDiv = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        recoveryForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> DIRAAYA...';

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    messageDiv.style.display = "block";
                    messageDiv.style.background = "rgba(0, 255, 136, 0.05)";
                    messageDiv.style.border = "1px solid rgba(0, 255, 136, 0.2)";
                    messageDiv.style.color = "#00ff88";
                    messageDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> Link-ga waa la soo diray! Hubi Email-kaaga.';
                    
                    resetBtn.style.display = "none";
                })
                .catch((error) => {
                    messageDiv.style.display = "block";
                    messageDiv.style.background = "rgba(255, 75, 75, 0.05)";
                    messageDiv.style.border = "1px solid rgba(255, 75, 75, 0.2)";
                    messageDiv.style.color = "#ff4b4b";
                    
                    const errorCode = error.code;
                    if (errorCode === 'auth/user-not-found') {
                        messageDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Email-kan laguma helin.';
                    } else {
                        messageDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Khalad baa dhacay. Isku day mar kale.';
                    }
                    
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> SEND RESET LINK';
                });
        });
    </script>
</body>
</html>

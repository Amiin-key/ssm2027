<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --accent: #00d4ff;
            --bg: #050505;
            --card: #0f0f0f;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; }

        /* HEADER */
        header {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            background: linear-gradient(to bottom, #000, transparent);
            position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-size: 20px; font-weight: 600; flex-grow: 1; text-align: center; margin-right: 30px; }
        .back-btn { 
            width: 40px; height: 40px; background: var(--glass); border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; border: 1px solid var(--border);
        }

        .container { padding: 0 20px; }

        /* DEPOSIT STEPS / INFO */
        .promo-card {
            background: linear-gradient(135deg, #001a11 0%, #050505 100%);
            padding: 25px; border-radius: 30px; border: 1px solid var(--primary);
            margin-bottom: 30px; position: relative; overflow: hidden;
        }
        .promo-card i { position: absolute; right: -10px; bottom: -10px; font-size: 80px; color: var(--primary); opacity: 0.1; }
        .promo-card h3 { font-size: 18px; color: var(--primary); margin-bottom: 5px; }
        .promo-card p { font-size: 11px; color: #aaa; line-height: 1.6; }

        /* PAYMENT METHODS GRID */
        .method-label { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; display: block; }
        .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        
        .method-item {
            background: var(--card); border: 1px solid var(--border);
            padding: 15px; border-radius: 20px; text-align: center;
            cursor: pointer; transition: 0.3s;
        }
        .method-item i { font-size: 24px; margin-bottom: 8px; display: block; color: #555; }
        .method-item span { font-size: 12px; font-weight: 600; color: #888; }
        
        .method-item.selected {
            border-color: var(--primary); background: rgba(0, 255, 136, 0.05);
        }
        .method-item.selected i, .method-item.selected span { color: var(--primary); }

        /* INPUT AREA */
        .input-box {
            background: var(--card); border-radius: 25px; padding: 25px; border: 1px solid var(--border);
        }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 10px; padding-left: 5px; }
        
        .field-wrapper { position: relative; display: flex; align-items: center; }
        .field-wrapper i { position: absolute; left: 18px; color: var(--primary); }
        .field-wrapper input {
            width: 100%; padding: 16px 16px 16px 50px; background: #000;
            border: 1px solid var(--border); border-radius: 18px; color: #fff;
            font-size: 15px; outline: none; transition: 0.3s;
        }
        .field-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 255, 136, 0.1); }

        /* BUTTON */
        .btn-deposit {
            width: 100%; padding: 20px; background: var(--primary);
            border: none; color: #000; font-weight: 700; border-radius: 20px;
            font-size: 16px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }
        .btn-deposit:active { transform: scale(0.98); }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; padding: 15px;
            border-top: 1px solid var(--border);
        }
        .nav-item { color: #444; text-decoration: none; text-align: center; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>Deposit Funds</h1>
    </header>

    <div class="container">
        <div class="promo-card">
            <h3>Nasiib Wanaagsan!</h3>
            <p>Ku dar lacag koontadaada si aad u bilowdo maalgashiga. Lacagtaadu waa mid ammaan ah.</p>
            <i class="fas fa-wallet"></i>
        </div>

        <span class="method-label">Xulo Habka Lacag bixinta</span>
        <div class="method-grid">
            <div class="method-item selected" onclick="selectMethod(this, 'EVC Plus')">
                <i class="fas fa-mobile-alt"></i>
                <span>EVC Plus</span>
            </div>
            <div class="method-item" onclick="selectMethod(this, 'eDahab')">
                <i class="fas fa-coins"></i>
                <span>eDahab</span>
            </div>
            <div class="method-item" onclick="selectMethod(this, 'Premier')">
                <i class="fas fa-university"></i>
                <span>Premier</span>
            </div>
            <div class="method-item" onclick="selectMethod(this, 'Sahal')">
                <i class="fas fa-bolt"></i>
                <span>Sahal</span>
            </div>
        </div>

        <div class="input-box">
            <form id="depositForm">
                <div class="input-group">
                    <label>Amount ($)</label>
                    <div class="field-wrapper">
                        <i class="fas fa-dollar-sign"></i>
                        <input type="number" id="depAmount" placeholder="Geli lacagta (Min $5)" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Lambarka Laga Soo Direy</label>
                    <div class="field-wrapper">
                        <i class="fas fa-receipt"></i>
                        <input type="text" id="txid" placeholder="Tusaale: 612xxxxxx" required>
                    </div>
                </div>

                <button type="submit" class="btn-deposit" id="depBtn">
                    Confirm Deposit <i class="fas fa-check-circle"></i>
                </button>
            </form>
        </div>

        <div style="margin-top: 20px; background: rgba(0,255,136,0.05); padding: 15px; border-radius: 15px; font-size: 11px; color: #888; border: 1px dashed #00ff88;">
            <b>Ogeysiis:</b> Fadlan lacagta ku dir nambarka <b>61XXXXXXX</b> ka dibna halkan ku qor TID-ga.
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="invest.html" class="nav-item"><i class="fas fa-rocket"></i><span>Invest</span></a>
        <a href="deposit.html" class="nav-item active"><i class="fas fa-plus-circle"></i><span>Deposit</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let selectedMethod = "EVC Plus";

    function selectMethod(el, method) {
        document.querySelectorAll('.method-item').forEach(m => m.classList.remove('selected'));
        el.classList.add('selected');
        selectedMethod = method;
    }

    document.getElementById('depositForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const amt = document.getElementById('depAmount').value;
        const tid = document.getElementById('txid').value;
        const btn = document.getElementById('depBtn');

        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        btn.disabled = true;

        try {
            const user = auth.currentUser;
            await db.collection("transactions").add({
                userId: user.uid,
                amount: parseFloat(amt),
                txid: tid,
                method: selectedMethod,
                type: "Deposit",
                status: "Pending",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Codisigii deposit-ka waa la diray!");
            window.location.href = "dashboard.html";
        } catch (err) {
            alert(err.message);
            btn.innerHTML = 'Confirm Deposit <i class="fas fa-check-circle"></i>';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Deposit</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --text-dim: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }

        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-nav a { 
            color: #fff; text-decoration: none; font-size: 1.1rem; 
            background: var(--card); width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 12px; border: 1px solid #222;
        }

        .payment-methods { 
            background: linear-gradient(135deg, #1a1a1a, #111);
            padding: 20px; border-radius: 20px; border: 1px solid #333; margin-bottom: 25px;
        }
        .method-item { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #222; }
        .method-item span { font-size: 0.85rem; color: var(--text-dim); }
        .method-item strong { color: var(--primary); font-family: 'Orbitron'; letter-spacing: 1px; }

        .form-card { background: var(--card); border: 1px solid #222; border-radius: 30px; padding: 25px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        .input-field { 
            width: 100%; background: #000; border: 1px solid #222; color: #fff; 
            padding: 16px 15px 16px 45px; border-radius: 15px; outline: none; font-size: 0.9rem;
        }

        .btn-deposit { 
            width: 100%; padding: 18px; background: var(--primary); border: none; 
            border-radius: 15px; font-family: 'Orbitron'; font-weight: bold; 
            cursor: pointer; color: #000; transition: 0.3s; margin-top: 10px;
        }
        
        .instructions { margin-top: 20px; font-size: 0.75rem; color: var(--text-dim); line-height: 1.6; }
        .instructions b { color: #fff; }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 0.9rem;">DEPOSIT FUNDS</h2>
    </div>

    <div class="payment-methods">
        <p style="font-size: 0.75rem; color: var(--text-dim); text-align: center;">Ku soo dir lacagta lambarada hoose:</p>
        <div class="method-item">
            <span>EVC Plus / Premier Wallet</span>
            <strong>618860930</strong>
        </div>
        <div class="method-item">
            <span>e-Dahab</span>
            <strong>627662041</strong>
        </div>
    </div>

    <div class="form-card">
        <form id="depositForm">
            <div class="input-group">
                <i class="fa-solid fa-dollar-sign"></i>
                <input type="number" id="amount" class="input-field" placeholder="Cadadka aad dirtay ($5)" required>
            </div>
            
            <div class="input-group">
                <i class="fa-solid fa-hashtag"></i>
                <input type="text" id="txid" class="input-field" placeholder="Transaction ID (618860930)" required>
            </div>

            <button type="submit" class="btn-deposit" id="depBtn">SUBMIT DEPOSIT</button>
        </form>

        <div class="instructions">
            <p>1. Lacagta ku soo dir mid ka mid ah lambarada kore.<br>
            2. Nuqul (Copy) ka soo qaado <b>TxID</b>-ga farriinta kuu timid.<br>
            3. Halkan ku buuxi foomka si haraagaaga loogu daro.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.firebasestorage.app",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const txid = document.getElementById('txid').value;
            const btn = document.getElementById('depBtn');

            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            try {
                await addDoc(collection(db, "transactions"), {
                    userId: auth.currentUser.uid,
                    amount: amount,
                    txid: txid,
                    type: "Deposit",
                    status: "Pending",
                    time: Date.now()
                });
                alert("Codsigaaga waa la helay! Waxaa lagu shaqayn doonaa waxyar ka dib.");
                window.location.href = "dashboard.html";
            } catch (err) {
                alert("Khalad baa dhacay: " + err.message);
                btn.disabled = false;
                btn.innerText = "SUBMIT DEPOSIT";
            }
        });
    </script>
</body>
</html>

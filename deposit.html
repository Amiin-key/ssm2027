<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Dhig Lacag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl space-y-6">
        
        <div class="flex items-center space-x-3 border-b border-gray-800 pb-4">
            <a href="dashboard.html" class="text-gray-400 hover:text-white transition-colors">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </a>
            <h2 class="text-xl font-bold flex items-center text-green-500">
                <i class="fa-solid fa-circle-dollar-to-slot mr-2"></i> Dhig Lacag
            </h2>
        </div>

        <div class="space-y-2">
            <div class="p-3 bg-gray-950 rounded-xl border border-gray-800/60 flex justify-between items-center text-sm">
                <span class="text-gray-400"><i class="fa-solid fa-mobile-screen mr-2 text-green-500"></i> EVC Plus</span>
                <span class="font-mono font-bold text-white">618860930</span>
            </div>
            <div class="p-3 bg-gray-950 rounded-xl border border-gray-800/60 flex justify-between items-center text-sm">
                <span class="text-gray-400"><i class="fa-solid fa-wallet mr-2 text-yellow-500"></i> eDahab</span>
                <span class="font-mono font-bold text-white">627662041</span>
            </div>
        </div>

        <form id="depositForm" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Cadadka ($)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-green-500 font-bold"><i class="fa-solid fa-dollar-sign"></i></span>
                    <input type="number" id="depositAmount" value="10" required min="1" class="w-full bg-gray-950 rounded-xl pl-10 pr-4 py-3 border border-gray-800 focus:outline-none focus:border-green-500 text-white font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-400 uppercase font-semibold mb-1">Taleefankaaga</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-phone"></i></span>
                    <input type="number" id="userPhone" placeholder="61XXXXXXX" required class="w-full bg-gray-950 rounded-xl pl-10 pr-4 py-3 border border-gray-800 focus:outline-none focus:border-green-500 text-white font-mono">
                </div>
            </div>

            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-xl font-bold transition-all shadow-lg shadow-green-600/10 flex justify-center items-center uppercase tracking-wider text-sm">
                <i class="fa-solid fa-paper-plane mr-2"></i> Xaqiiji Dirista
            </button>
        </form>
    </div>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('depositAmount').value);
            const phone = document.getElementById('userPhone').value;
            const user = auth.currentUser;

            if(!user) return window.location.href = "login.html";

            try {
                await addDoc(collection(db, "transactions"), {
                    userId: user.uid,
                    amount: amount,
                    method: phone.startsWith("61") ? "EVC Plus" : "eDahab",
                    txid: phone,
                    type: "Deposit",
                    status: "Pending",
                    date: serverTimestamp()
                });

                Swal.fire({
                    title: 'Waa la diray!',
                    text: 'Codsigaaga lacag dhigashada si guul leh ayaa loo diray, maamulka ayaa xaqiijin doona dhakhso.',
                    icon: 'success',
                    background: '#111827',
                    color: '#ffffff',
                    confirmButtonColor: '#10B981',
                    customClass: { popup: 'border border-gray-800 rounded-2xl' }
                }).then(() => { window.location.href = "dashboard.html"; });

            } catch (error) {
                Swal.fire({ title: 'Cilad baa dhacday!', text: error.message, icon: 'error', background: '#111827', color: '#ffffff', confirmButtonColor: '#EF4444' });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Deposit</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }
        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-nav a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        .dep-card { background: var(--card); border: 1px solid #222; border-radius: 25px; padding: 25px; text-align: center; }
        .evc-box { background: #000; padding: 15px; border-radius: 15px; border: 1px dashed var(--primary); margin: 20px 0; color: var(--primary); font-weight: bold; font-family: 'Orbitron'; }
        .input-field { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 12px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 1rem;">DEPOSIT FUNDS</h2>
    </div>

    <div class="dep-card">
        <p style="font-size: 0.8rem; color: #888;">Fadlan lacagta ku dir lambarka hoose (EVC Plus):</p>
        <div class="evc-box" id="adminNumber">61XXXXXXX</div>
        
        <form id="depositForm">
            <input type="number" id="amount" class="input-field" placeholder="Cadadka ($)" required>
            <input type="text" id="txid" class="input-field" placeholder="Transaction ID (TxID)" required>
            <button type="submit" class="btn-submit" id="depBtn">SUBMIT DEPOSIT</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Soo aqri Lambarka Admin-ka
        onSnapshot(doc(db, "settings", "app_config"), (doc) => {
            if(doc.exists()) document.getElementById('adminNumber').innerText = doc.data().evcNumber;
        });

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) return;

            document.getElementById('depBtn').disabled = true;
            document.getElementById('depBtn').innerText = "Processing...";

            try {
                await addDoc(collection(db, "transactions"), {
                    userId: user.uid,
                    amount: parseFloat(document.getElementById('amount').value),
                    txid: document.getElementById('txid').value,
                    type: "Deposit",
                    status: "Pending",
                    time: Date.now()
                });
                alert("Codsigaaga waa la diray! Sug inta laga hubinayo.");
                window.location.href = "dashboard.html";
            } catch(err) { alert(err.message); }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --bg: #050505;
            --card: #0f0f0f;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; }

        .back-btn { color: var(--primary); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }

        .dep-card {
            background: var(--card);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); font-size: 20px; margin-bottom: 10px; }
        p.desc { font-size: 12px; color: #888; margin-bottom: 25px; }

        .method-box {
            background: #151515;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .method-box.active { border-color: var(--primary); background: rgba(0,255,136,0.05); }
        .method-box i { font-size: 20px; color: var(--primary); }
        .method-box span { font-weight: 600; font-size: 14px; }

        .form-group { margin-top: 20px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 8px; }
        input {
            width: 100%; padding: 15px; background: #000; border: 1px solid var(--border);
            border-radius: 12px; color: #fff; font-size: 14px; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn-send {
            width: 100%; padding: 16px; background: var(--primary); color: #000;
            border: none; border-radius: 12px; font-weight: 800; margin-top: 30px;
            cursor: pointer; transition: 0.3s; font-family: 'Orbitron', sans-serif;
        }
        .btn-send:disabled { background: #333; cursor: not-allowed; color: #777; }
    </style>
</head>
<body>

    <div class="header">
    <a href="dashboard.html" style="color: white; text-decoration: none;">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h2>Deposit Money</h2>
    <div></div> </div>
    

    <div class="dep-card">
        <h2>Deposit Funds</h2>
        <p class="desc">Dooro habka lacag bixinta oo geli xogta lacagta.</p>

        <div class="method-box active" onclick="selectMethod('EVC Plus', this)">
            <i class="fas fa-mobile-alt"></i>
            <div>
                <span>EVC Plus</span>
                <p style="font-size: 10px; color: #555;">Lambarka: 61XXXXXXX</p>
            </div>
        </div>

        <div class="method-box" onclick="selectMethod('e-Dahab', this)">
            <i class="fas fa-wallet"></i>
            <div>
                <span>e-Dahab</span>
                <p style="font-size: 10px; color: #555;">Lambarka: 62XXXXXXX</p>
            </div>
        </div>

        <div class="form-group">
            <label>Cadadka (USD)</label>
            <input type="number" id="amount" placeholder="Geli lacagta tusaale: 10">
        </div>

        <div class="form-group">
            <label>Transaction ID (Tid)</label>
            <input type="text" id="txid" placeholder="Geli lambarka fariinta (Tid)">
        </div>

        <button class="btn-send" id="submitBtn" onclick="submitDeposit()">DIR CODSIGA</button>
    </div>

<script>
    // Config-gaaga Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let selectedMethod = "EVC Plus";

    function selectMethod(name, el) {
        selectedMethod = name;
        document.querySelectorAll('.method-box').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    async function submitDeposit() {
        const amount = document.getElementById('amount').value;
        const txid = document.getElementById('txid').value;
        const btn = document.getElementById('submitBtn');

        if(!amount || !txid) return alert("Fadlan buuxi dhammaan meelaha bannaan.");

        btn.disabled = true;
        btn.innerText = "DIRAYSA...";

        try {
            const user = auth.currentUser;
            
            // Si toos ah loogu kaydiyo Firestore iyada oo aan sawir jirin
            await db.collection("transactions").add({
                userId: user.uid,
                userName: user.displayName || "User",
                amount: parseFloat(amount),
                txid: txid,
                method: selectedMethod,
                type: "Deposit",
                status: "Pending",
                date: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Waa lagu guuleystay! Codsigaaga waa la hubinayaa.");
            window.location.href = "dashboard.html";
        } catch (e) {
            alert("Cilad: " + e.message);
            btn.disabled = false;
            btn.innerText = "DIR CODSIGA";
        }
    }
</script>
</body>
</html>

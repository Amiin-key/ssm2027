<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Deposit</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --input-bg: #0a0a0a; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }
        
        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-nav a { color: #fff; text-decoration: none; font-size: 1.2rem; }
        
        .dep-card { 
            background: var(--card); 
            border: 1px solid #222; 
            border-radius: 20px; 
            padding: 25px; 
            text-align: center; 
        }

        /* Box-ka USSD ee Caadiga ah */
        .ussd-box { 
            background: #000; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px dashed var(--primary); 
            margin: 20px 0; 
            color: var(--primary); 
            font-family: 'Orbitron'; 
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .ussd-box i { color: #fff; font-size: 1.2rem; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        .input-field { 
            width: 100%; background: var(--input-bg); border: 1px solid #333; 
            color: #fff; padding: 15px 15px 15px 45px; border-radius: 10px; 
            outline: none; box-sizing: border-box; 
        }
        
        .btn-submit { 
            width: 100%; padding: 15px; background: var(--primary); 
            border: none; border-radius: 10px; font-family: 'Orbitron'; 
            font-weight: bold; cursor: pointer; color: #000; 
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 1rem;">DEPOSIT FUNDS</h2>
    </div>

    <div class="dep-card">
        <i class="fa-solid fa-building-columns" style="font-size: 2rem; color: var(--primary); margin-bottom: 10px;"></i>
        <p style="font-size: 0.85rem; color: #888;">Fadlan lacagta ku dir code-kan hoose:</p>
        
        <!-- Box-ka Copy-ga -->
        <div class="ussd-box" onclick="copyCode()">
            <span id="ussdCode">*712*618860930*100#</span>
            <i class="fa-regular fa-copy"></i>
        </div>
        <p id="copyMsg" style="color: var(--primary); font-size: 0.8rem; display: none; margin-top: -10px; margin-bottom: 15px;">Waa la koobiyeeyay!</p>
        
        <form id="depositForm">
            <div class="input-group">
                <i class="fa-solid fa-dollar-sign"></i>
                <input type="number" id="amount" class="input-field" placeholder="Cadadka ($)" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-receipt"></i>
                <input type="text" id="txid" class="input-field" placeholder="Transaction ID (TxID)" required>
            </div>

            <button type="submit" class="btn-submit" id="depBtn">
                <i class="fa-solid fa-paper-plane"></i> SUBMIT DEPOSIT
            </button>
        </form>
    </div>

    <script>
        // Fariinta Copy-ga
        function copyCode() {
            const code = document.getElementById("ussdCode").innerText;
            navigator.clipboard.writeText(code).then(() => {
                const msg = document.getElementById("copyMsg");
                msg.style.display = "block";
                setTimeout(() => { msg.style.display = "none"; }, 2000);
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) return alert("Fadlan marka hore gal akoonkaaga (Login)");

            const btn = document.getElementById('depBtn');
            btn.disabled = true;
            btn.innerHTML = "Processing...";

            try {
                await addDoc(collection(db, "transactions"), {
                    userId: user.uid,
                    amount: parseFloat(document.getElementById('amount').value),
                    txid: document.getElementById('txid').value,
                    type: "Deposit",
                    status: "Pending",
                    time: Date.now()
                });
                alert("Codsigaaga waa la diray! Sug inta laga hubinayo.");
                window.location.href = "dashboard.html";
            } catch(err) { 
                alert(err.message); 
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> SUBMIT DEPOSIT`;
            }
        });
    </script>
</body>
</html>

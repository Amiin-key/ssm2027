<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is-diiwaangeli | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --bg: #050505;
            --card: #111;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

        .reg-card {
            background: var(--card);
            padding: 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .reg-card h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 10px; text-align: center; }
        .reg-card p { font-size: 13px; color: #888; text-align: center; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group i.main-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        
        /* Isha Style-keeda */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            cursor: pointer;
            transition: 0.3s;
        }
        .toggle-password:hover { color: var(--primary); }

        input {
            width: 100%;
            padding: 15px 45px 15px 45px; /* Spacing labada dhinac ah */
            background: #000;
            border: 1px solid var(--border);
            border-radius: 15px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .btn-reg {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-reg:active { transform: scale(0.98); }

        .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: #777; }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 600; }

        .ref-notice {
            background: rgba(0, 255, 136, 0.1);
            color: var(--primary);
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <h2>CREATE ACCOUNT</h2>
        <p>Ku soo biir SSM INVEST maanta.</p>

        <div id="refNotice" class="ref-notice">
            <i class="fas fa-gift"></i> Waxaa ku soo casuumay saaxiibkaaga!
        </div>

        <form id="regForm">
            <div class="input-group">
                <i class="fas fa-user main-icon"></i>
                <input type="text" id="fullName" placeholder="Magacaaga oo buuxa" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope main-icon"></i>
                <input type="email" id="email" placeholder="Email-kaaga" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock main-icon"></i>
                <input type="password" id="password" placeholder="Password cusub" required>
                <i class="fas fa-eye toggle-password" id="eyeIcon" onclick="togglePass()"></i>
            </div>
            <button type="submit" class="btn-reg" id="regBtn">Is-diiwaangeli</button>
        </form>

        <p class="footer-text">Hadda ka hor miyaad is-diiwaangelisay? <a href="log.html">Soo gal</a></p>
    </div>

<script>
    // 1. Isha Logic-geeda
    function togglePass() {
        const passInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }

    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const referralId = urlParams.get('ref');

    if (referralId) {
        document.getElementById('refNotice').style.display = 'block';
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('regBtn');
        const name = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;

        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
            const user = userCredential.user;

            await db.collection("users").doc(user.uid).set({
                fullName: name,
                email: email,
                balance: 0,
                activeInvestments: [],
                referredBy: referralId || null,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Hambalyo! Account-kaaga waa la sameeyay.");
            window.location.href = "dashboard.html";

        } catch (error) {
            alert("Cilad: " + error.message);
            btn.innerText = "Is-diiwaangeli";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>

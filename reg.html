<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM 2027 | Is-diiwaangali</title>

    <!-- ✅ Firebase SDK (SAH AH) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .reg-card { background: var(--card); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; border: 1px solid #222; text-align: center; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 12px; outline: none; }
        .btn-reg { width: 100%; padding: 15px; background: var(--primary); border: none; color: #000; font-weight: 900; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

<div class="reg-card">
    <h2 style="color: var(--primary); margin-bottom: 20px;">SSM INVEST</h2>
    
    <input type="text" id="fullName" placeholder="Magaca oo buuxa">
    <input type="email" id="email" placeholder="Email-kaaga">
    <input type="password" id="password" placeholder="Password cusub">
    
    <button class="btn-reg" onclick="register()">ABUUR ACCOUNT</button>
    <div id="status"></div>
</div>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
  authDomain: "ssm-invest.firebaseapp.com",
  projectId: "ssm-invest",
  storageBucket: "ssm-invest.firebasestorage.app",
  messagingSenderId: "1029622095378",
  appId: "1:1029622095378:web:01d95a354b582c0f7902cb",
  measurementId: "G-HS16FERS90"
};

// Init Firebase
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// REGISTER FUNCTION
function register() {
    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value.trim();
    const status = document.getElementById("status");

    if (!name || !email || !pass) {
        alert("Fadlan buuxi dhammaan!");
        return;
    }

    status.innerText = "Loading...";

    auth.createUserWithEmailAndPassword(email, pass)
    .then((userCredential) => {
        const user = userCredential.user;

        return db.collection("users").doc(user.uid).set({
            fullName: name,
            email: email,
            balance: 0,
            role: "user",
            createdAt: new Date().toISOString()
        });
    })
    .then(() => {
        status.style.color = "#00ff88";
        status.innerText = "Guul! Redirecting...";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1500);
    })
    .catch((error) => {
        status.style.color = "red";
        status.innerText = error.message;
        alert(error.message);
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --text-dim: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; padding-bottom: 100px; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); }
        .user-info h4 { font-size: 0.85rem; font-weight: 600; }
        .user-info p { font-size: 0.65rem; color: var(--text-dim); }

        /* Balance Card */
        .balance-card { 
            background: linear-gradient(135deg, #111, #0a0a0a); 
            padding: 30px; 
            border-radius: 30px; 
            text-align: center; 
            border: 1px solid #222; 
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        .balance-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,255,136,0.05) 0%, transparent 70%);
        }
        .balance-amount { font-family: 'Orbitron'; font-size: 2.2rem; color: var(--primary); margin: 10px 0; letter-spacing: 1px; }

        /* Grid Menu */
        .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .menu-item { 
            background: var(--card); 
            padding: 20px 10px; 
            border-radius: 20px; 
            text-align: center; 
            border: 1px solid #222; 
            text-decoration: none; 
            color: #fff; 
            transition: 0.3s;
        }
        .menu-item:active { transform: scale(0.9); background: #1a1a1a; }
        .menu-item i { display: block; font-size: 1.6rem; color: var(--primary); margin-bottom: 10px; }
        .menu-item span { font-size: 0.65rem; font-weight: 600; letter-spacing: 1px; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid #222;
            z-index: 1000;
        }
        .nav-link { color: #555; text-decoration: none; text-align: center; font-size: 1.2rem; transition: 0.3s; }
        .nav-link.active { color: var(--primary); }
        .nav-link span { display: block; font-size: 0.6rem; margin-top: 5px; font-family: 'Orbitron'; }

        /* Section Title */
        .section-title { font-family: 'Orbitron'; font-size: 0.8rem; margin-bottom: 15px; color: var(--text-dim); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=User&background=00ff88&color=000" id="user-avatar" alt="User">
            <div class="user-info">
                <h4 id="user-name">Loading...</h4>
                <p><i class="fa-solid fa-circle" style="color: var(--primary); font-size: 0.5rem;"></i> Verified Account</p>
            </div>
        </div>
        <div style="background: var(--card); padding: 10px; border-radius: 12px; border: 1px solid #222;">
            <i class="fa-solid fa-bell"></i>
        </div>
    </div>

    <div class="balance-card">
        <small style="color: var(--text-dim); letter-spacing: 2px;">AVAILABLE BALANCE</small>
        <div class="balance-amount" id="balance">$0.00</div>
        <div style="font-size: 0.7rem; color: var(--primary); font-weight: 600;">
            <i class="fa-solid fa-chart-line"></i> +2.5% Profit Today
        </div>
    </div>

    <div class="section-title">
        <span>QUICK SERVICES</span>
        <i class="fa-solid fa-ellipsis"></i>
    </div>

    <div class="grid-menu">
        <a href="deposit.html" class="menu-item">
            <i class="fa-solid fa-building-columns"></i>
            <span>DEPOSIT</span>
        </a>
        <a href="withdraw.html" class="menu-item">
            <i class="fa-solid fa-money-bill-transfer"></i>
            <span>WITHDRAW</span>
        </a>
        <a href="invest.html" class="menu-item">
            <i class="fa-solid fa-rocket"></i>
            <span>INVEST</span>
        </a>
        <a href="history.html" class="menu-item">
            <i class="fa-solid fa-list-check"></i>
            <span>HISTORY</span>
        </a>
        <a href="referral.html" class="menu-item">
            <i class="fa-solid fa-gift"></i>
            <span>REFERRAL</span>
        </a>
        <a href="support.html" class="menu-item">
            <i class="fa-solid fa-headset"></i>
            <span>SUPPORT</span>
        </a>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-link active">
            <i class="fa-solid fa-house-chimney"></i>
            <span>HOME</span>
        </a>
        <a href="invest.html" class="nav-link">
            <i class="fa-solid fa-chart-pie"></i>
            <span>ASSETS</span>
        </a>
        <a href="profile.html" class="nav-link">
            <i class="fa-solid fa-user-gear"></i>
            <span>PROFILE</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('balance').innerText = "$" + (data.balance || 0).toFixed(2);
                        document.getElementById('user-name').innerText = data.fullName || "User";
                        
                        // Update Avatar with initials
                        const name = data.fullName || "User";
                        document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${name}&background=00ff88&color=000`;
                    }
                });
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #0f0f0f; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; }

        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-btn { color: var(--primary); text-decoration: none; font-size: 18px; }

        .container { background: var(--card); border-radius: 25px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); margin-bottom: 20px; font-size: 22px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; }
        input:focus { border-color: var(--primary); }

        .upload-box {
            border: 2px dashed var(--border);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .upload-box:hover { border-color: var(--primary); background: rgba(0,255,136,0.02); }
        .upload-box i { font-size: 30px; color: #444; margin-bottom: 10px; }
        #preview { width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid var(--border); }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:disabled { background: #333; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <a href="dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h3 style="font-family: 'Orbitron', sans-serif;">Deposit</h3>
    </div>

    <div class="container">
        <h2>Lacag Dhigasho</h2>
        
        <div class="input-group">
            <label>Cadadka (USD)</label>
            <input type="number" id="amountInput" placeholder="Tusaale: 10">
        </div>

        <div class="input-group">
            <label>Transaction ID / Tid</label>
            <input type="text" id="tidInput" placeholder="Geli lambarka fariinta">
        </div>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-file-invoice-dollar"></i>
            <p id="uploadText" style="font-size: 12px; color: #555;">Click to upload Screenshot</p>
            <img id="preview">
            <input type="file" id="fileInput" hidden accept="image/*" onchange="previewImage(this)">
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitDeposit()">DIR CODSIGA</button>
    </div>

<script>
    // Config-gaaga Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();

    let userDoc = null;
    let selectedFile = null;

    // Soo jiid xogta User-ka markuu galo
    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                userDoc = doc.data();
            });
        } else {
            window.location.href = "log.html";
        }
    });

    function previewImage(input) {
        if (input.files && input.files[0]) {
            selectedFile = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('uploadText').style.display = 'none';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function submitDeposit() {
        const amount = document.getElementById('amountInput').value;
        const tid = document.getElementById('tidInput').value;
        const btn = document.getElementById('submitBtn');

        if (!amount || !tid || !selectedFile) {
            return alert("Fadlan buuxi dhamaan meelaha banaan!");
        }

        btn.disabled = true;
        btn.innerText = "DIRAYSA...";

        try {
            const user = auth.currentUser;
            
            // 1. Upload Screenshot to Storage
            const storageRef = storage.ref(`proofs/${user.uid}_${Date.now()}`);
            const uploadTask = await storageRef.put(selectedFile);
            const downloadURL = await uploadTask.ref.getDownloadURL();

            // 2. Save Transaction to Firestore
            await db.collection("transactions").add({
                userId: user.uid,
                userName: userDoc.fullName || "User",
                amount: parseFloat(amount),
                tid: tid,
                proofImage: downloadURL,
                type: "Deposit",
                status: "Pending",
                date: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Codsigaaga waa la diray! Admin-ka ayaa hubin doona.");
            window.location.href = "dashboard.html";

        } catch (error) {
            console.error(error);
            alert("Cilad: " + error.message);
            btn.disabled = false;
            btn.innerText = "DIR CODSIGA";
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM GLOBAL | Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --primary: #00ff88; 
            --danger: #ff3e3e; 
            --bg: #050505; 
            --card: #121212; 
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255,255,255,0.1); 
            --accent: #00d4ff; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* Header & Logo */
        .top-nav {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: rgba(5,5,5,0.85); backdrop-filter: blur(12px); z-index: 1000;
        }
        .logo-text { font-family: 'Orbitron'; font-weight: 900; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 18px; letter-spacing: 1px; }
        
        .notif-btn { position: relative; width: 42px; height: 42px; background: var(--glass); border-radius: 14px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        .notif-badge { position: absolute; top: -2px; right: -2px; background: var(--danger); width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); display: none; }

        /* Main Portfolio Card */
        .hero-section { padding: 0 20px 25px; }
        .main-card {
            background: linear-gradient(145deg, #0a0a0a, #151515);
            padding: 35px 20px; border-radius: 32px; border: 1px solid var(--border);
            text-align: center; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .bal-label { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: #666; margin-bottom: 10px; }
        .bal-amount { font-family: 'Orbitron'; font-size: 34px; font-weight: 900; margin-bottom: 8px; color: #fff; }
        .profit-live { font-family: 'Orbitron'; font-size: 13px; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* Actions Grid */
        .actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 0 20px 30px; }
        .action-item { text-align: center; text-decoration: none; color: #777; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .action-icon { 
            width: 58px; height: 58px; background: var(--glass); border-radius: 20px; 
            display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
            color: #fff; font-size: 20px; border: 1px solid var(--border);
        }
        .action-item:active { transform: scale(0.9); color: var(--primary); }

        /* Investment Cards */
        .section-header { padding: 0 25px 15px; font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 1.5px; }
        .asset-list { padding: 0 20px; }
        .asset-card {
            background: #0f0f0f; border-radius: 22px; padding: 18px 22px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
        }
        .asset-info h4 { font-size: 14px; margin-bottom: 4px; }
        .asset-info p { font-size: 11px; color: #555; }
        .asset-profit { font-family: 'Orbitron'; font-size: 12px; color: var(--primary); font-weight: 700; text-align: right; }

        /* Plan Scrolling */
        .plan-scroll { display: flex; gap: 16px; overflow-x: auto; padding: 0 20px 30px; }
        .plan-card {
            min-width: 170px; background: #111; border-radius: 26px; padding: 22px;
            border: 1px solid var(--border);
        }
        .plan-roi { font-family: 'Orbitron'; color: var(--primary); font-size: 20px; font-weight: 900; margin: 10px 0; }
        .btn-action { background: var(--primary); color: #000; border: none; padding: 12px; width: 100%; border-radius: 14px; font-weight: 800; font-size: 11px; cursor: pointer; }

        /* Bottom Tab Bar */
        .tab-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85px;
            background: rgba(8, 8, 8, 0.98); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border); padding-bottom: 15px; z-index: 1000;
        }
        .tab-item { color: #444; text-align: center; font-size: 10px; transition: 0.3s; }
        .tab-item i { font-size: 22px; margin-bottom: 5px; display: block; }
        .tab-item.active { color: var(--primary); }

        /* Content Pages */
        .page { display: none; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Inputs & Modals */
        .input-box { padding: 0 20px; margin-top: 15px; }
        .modern-field { 
            width: 100%; padding: 20px; background: #111; border: 1px solid var(--border); 
            border-radius: 20px; color: #fff; outline: none; margin-top: 10px;
        }
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 30px;
        }
        .modal-ui {
            background: #151515; border: 1px solid var(--border); border-radius: 30px;
            padding: 40px 25px; width: 100%; max-width: 400px; text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo-text">SSM GLOBAL</div>
        <div class="notif-btn" onclick="toggleModal('notifModal', true)">
            <i class="fas fa-bell"></i>
            <span id="notifBadge" class="notif-badge"></span>
        </div>
    </div>

    <div id="notifModal" class="modal">
        <div class="modal-ui">
            <i class="fas fa-envelope-open-text" style="font-size: 45px; color: var(--primary); margin-bottom: 20px;"></i>
            <h2 style="font-family: 'Orbitron'; font-size: 16px; margin-bottom: 12px;">FARRIIN CUSUB</h2>
            <p id="notifContent" style="color: #888; font-size: 13px; margin-bottom: 30px;">...</p>
            <button class="btn-action" onclick="closeNotif()">WAAN AKHRIYEY</button>
        </div>
    </div>

    <div id="home" class="page active">
        <div class="hero-section">
            <div class="main-card">
                <p class="bal-label">Total Balance</p>
                <div class="bal-amount" id="displayBal">$0.00</div>
                <div class="profit-live">
                    <i class="fas fa-chart-line"></i>
                    <span id="liveTotalProfit">+$0.000000</span>
                </div>
            </div>
        </div>

        <div class="actions-grid">
            <div class="action-item" onclick="switchTab('deposit')"><div class="action-icon"><i class="fas fa-plus"></i></div>Deposit</div>
            <div class="action-item" onclick="switchTab('withdraw')"><div class="action-icon"><i class="fas fa-wallet"></i></div>Withdraw</div>
            <div class="action-item" onclick="switchTab('invest')"><div class="action-icon"><i class="fas fa-rocket"></i></div>Invest</div>
            <div class="action-item" onclick="alert('Dhawaan...')"><div class="action-icon"><i class="fas fa-history"></i></div>History</div>
        </div>

        <div class="section-header">Active Assets</div>
        <div id="assetList" class="asset-list"></div>
    </div>

    <div id="invest" class="page">
        <div class="section-header" style="margin-top: 10px;">Investment Plans</div>
        <div class="plan-scroll" id="planContainer"></div>
    </div>

    <div id="deposit" class="page">
        <div class="section-header" style="margin-top: 10px;">Deposit Money</div>
        <div class="input-box">
            <div class="modern-field" style="display: flex; justify-content: space-between; border-color: var(--primary);">
                <span id="payNumber" style="font-family: 'Orbitron'; font-weight: 700;">618860930</span>
                <span onclick="copy('payNumber')" style="color: var(--primary); font-size: 12px; font-weight: 800; cursor: pointer;">COPY</span>
            </div>
            <input type="text" id="tidInput" placeholder="Geli Transaction ID (TID)" class="modern-field">
            <button class="btn-action" style="margin-top: 20px; padding: 18px;" onclick="sendDeposit()">SUBMIT DEPOSIT</button>
        </div>
    </div>

    <div id="withdraw" class="page">
        <div class="section-header" style="margin-top: 10px;">Withdraw Money</div>
        <div class="input-box">
            <input type="number" id="wAmount" placeholder="Cadadka ($)" class="modern-field">
            <input type="number" id="wPhone" placeholder="Lambarka EVC Plus" class="modern-field">
            <button class="btn-action" style="margin-top: 20px; padding: 18px; background: var(--danger); color: #fff;" onclick="sendWithdraw()">CONFIRM WITHDRAW</button>
        </div>
    </div>

    <div id="profile" class="page">
        <div style="text-align: center; padding: 60px 20px;">
            <div style="width: 80px; height: 80px; background: var(--glass); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 1px solid var(--primary);" id="uAvatar">U</div>
            <h2 id="uName">User</h2>
            <p id="uEmail" style="color: #555; font-size: 12px; margin-bottom: 30px;">...</p>
            <button class="btn-action" style="background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 10px 40px;" onclick="auth.signOut()">Logout</button>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i>Home</div>
        <div class="tab-item" onclick="switchTab('invest', this)"><i class="fas fa-seedling"></i>Invest</div>
        <div class="tab-item" onclick="switchTab('deposit', this)"><i class="fas fa-plus-circle"></i>Deposit</div>
        <div class="tab-item" onclick="switchTab('profile', this)"><i class="fas fa-user-circle"></i>Profile</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();

        let currentBal = 0, currentInvs = [], activeNotifId = null;

        // Auth & Sync
        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        currentBal = parseFloat(d.balance) || 0;
                        currentInvs = d.activeInvestments || [];
                        document.getElementById('displayBal').innerText = "$" + currentBal.toFixed(2);
                        document.getElementById('uName').innerText = d.fullName || "User";
                        document.getElementById('uEmail').innerText = user.email;
                        document.getElementById('uAvatar').innerText = (d.fullName ? d.fullName[0] : "U").toUpperCase();
                        renderAssets();
                    }
                });

                db.collection("notifications").where("userId", "==", user.uid).where("read", "==", false).limit(1).onSnapshot(snap => {
                    if (!snap.empty) {
                        const n = snap.docs[0];
                        document.getElementById('notifBadge').style.display = "block";
                        document.getElementById('notifContent').innerText = n.data().message;
                        activeNotifId = n.id;
                    } else {
                        document.getElementById('notifBadge').style.display = "none";
                    }
                });
            } else { window.location.href = "login.html"; }
        });

        function switchTab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
        }

        function toggleModal(id, show) { document.getElementById(id).style.display = show ? "flex" : "none"; }

        function closeNotif() {
            if(activeNotifId) db.collection("notifications").doc(activeNotifId).update({read: true});
            toggleModal('notifModal', false);
        }

        // Invest Logic
        const plans = [
            {n: "Solar Africa", r: 5.5, m: 10},
            {n: "Geeska Tech", r: 8.5, m: 50},
            {n: "VIP Trade", r: 15.0, m: 200}
        ];

        document.getElementById('planContainer').innerHTML = plans.map(p => `
            <div class="plan-card">
                <div style="font-size: 11px; color:#555;">${p.n}</div>
                <div class="plan-roi">${p.r}%</div>
                <div style="font-size: 9px; margin-bottom:15px; color:#888;">Min Investment: $${p.m}</div>
                <button class="btn-action" onclick="processInvest('${p.n}', ${p.m}, ${p.r})">INVEST NOW</button>
            </div>
        `).join('');

        async function processInvest(n, m, r) {
            if(currentBal < m) return alert("Haraagaagu kuma filna!");
            if(confirm(`Ma hubtaa inaad $${m} ku maalgashato ${n}?`)) {
                await db.collection("users").doc(auth.currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(-m),
                    activeInvestments: firebase.firestore.FieldValue.arrayUnion({
                        planName: n, amount: Number(m), roi: Number(r), time: Date.now()
                    })
                });
                alert("Guul! Maalgashigaagii waa bilaabmay.");
            }
        }

        function renderAssets() {
            const container = document.getElementById('assetList');
            if(currentInvs.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#333; padding:30px; font-size:12px;">Ma jiraan maalgashi hadda kuu socda.</p>';
                return;
            }
            container.innerHTML = currentInvs.map((v, i) => `
                <div class="asset-card">
                    <div class="asset-info"><h4>${v.planName}</h4><p>Invested: $${parseFloat(v.amount).toFixed(2)}</p></div>
                    <div class="asset-profit" id="p-${i}">+$0.000000</div>
                </div>
            `).join('');
        }

        // Live Engine - Safe from NaN
        setInterval(() => {
            if(!currentInvs || currentInvs.length === 0) {
                document.getElementById('liveTotalProfit').innerText = "+$0.000000";
                return;
            }
            let total = 0;
            currentInvs.forEach((v, i) => {
                const amount = parseFloat(v.amount) || 0;
                const roi = parseFloat(v.roi) || 0;
                const startTime = parseInt(v.time) || Date.now();
                
                const secondsPassed = (Date.now() - startTime) / 1000;
                const profit = secondsPassed * ((amount * (roi / 100)) / 86400);

                if(!isNaN(profit) && isFinite(profit)) {
                    total += profit;
                    const el = document.getElementById(`p-${i}`);
                    if(el) el.innerText = "+$" + profit.toFixed(6);
                }
            });
            document.getElementById('liveTotalProfit').innerText = "+$" + total.toFixed(6);
        }, 1000);

        function copy(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert("Lambarka waa la koobiyeeyay!");
        }

        async function sendDeposit() {
            const t = document.getElementById('tidInput').value;
            if(!t) return alert("Geli TID!");
            await db.collection("transactions").add({
                userId: auth.currentUser.uid, type: "Deposit", txid: t, status: "Pending", time: Date.now()
            });
            alert("Codsigaaga waa la diray.");
            document.getElementById('tidInput').value = "";
        }

        async function sendWithdraw() {
            const a = document.getElementById('wAmount').value;
            if(!a || a > currentBal) return alert("Haraagaagu kuma filna!");
            await db.collection("transactions").add({
                userId: auth.currentUser.uid, type: "Withdraw", amount: Number(a), status: "Pending", time: Date.now()
            });
            alert("Codsigaaga waa la diray.");
            document.getElementById('wAmount').value = "";
        }
    </script>
</body>
                </html>

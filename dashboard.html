<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM GLOBAL | Professional Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { 
            --primary: #00ff88; 
            --danger: #ff3e3e; 
            --bg: #050505; 
            --card: #121212; 
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255,255,255,0.08); 
            --accent: #00d4ff; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        ::-webkit-scrollbar { width: 0; }

        .top-nav {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); z-index: 1000;
        }
        .logo-text { font-family: 'Orbitron'; font-weight: 900; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 18px; }
        
        .notif-btn { position: relative; width: 40px; height: 40px; background: var(--glass); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        .notif-badge { position: absolute; top: -2px; right: -2px; background: var(--danger); width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--bg); display: none; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 25px;
        }
        .modal-content {
            background: #181818; border: 1px solid var(--primary); border-radius: 28px;
            padding: 35px 25px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }

        .hero-section { padding: 0 20px 20px; }
        .main-card {
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            padding: 30px; border-radius: 32px; border: 1px solid var(--border);
            text-align: center; position: relative; overflow: hidden;
        }
        .bal-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 8px; }
        .bal-amount { font-family: 'Orbitron'; font-size: 32px; font-weight: 900; margin-bottom: 5px; }
        .profit-live { font-family: 'Orbitron'; font-size: 12px; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 18px; }

        .actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 0 20px 25px; }
        .action-item { text-align: center; text-decoration: none; color: #888; font-size: 10px; cursor: pointer; }
        .action-icon { 
            width: 55px; height: 55px; background: var(--glass); border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;
            color: #fff; font-size: 18px; border: 1px solid var(--border); transition: 0.3s;
        }

        .section-title { padding: 0 25px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        
        .plan-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 0 20px 25px; }
        .plan-card {
            min-width: 160px; background: var(--card); border-radius: 24px; padding: 20px;
            border: 1px solid var(--border);
        }
        .plan-roi { font-family: 'Orbitron'; color: var(--primary); font-size: 18px; margin: 10px 0; }
        .btn-small { background: var(--primary); color: #000; border: none; padding: 10px 0; width: 100%; border-radius: 12px; font-weight: 700; font-size: 11px; cursor: pointer; }

        .tab-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid var(--border); padding-bottom: 15px; z-index: 1000;
        }
        .tab-item { color: #555; text-align: center; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .tab-item i { font-size: 20px; margin-bottom: 4px; display: block; }
        .tab-item.active { color: var(--primary); }

        .content { display: none; animation: fadeIn 0.5s ease; padding-top: 10px; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .modern-input { 
            width: 100%; padding: 18px; background: var(--glass); border: 1px solid var(--border); 
            border-radius: 18px; color: #fff; outline: none; margin: 10px 0;
        }

        .asset-card {
            background: var(--glass); border-radius: 20px; padding: 18px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo-text">SSM GLOBAL</div>
        <div class="notif-btn" onclick="openNotif()">
            <i class="fas fa-bell"></i>
            <span id="badge" class="notif-badge"></span>
        </div>
    </div>

    <div id="notifModal" class="modal">
        <div class="modal-content">
            <i class="fas fa-envelope-open-text" style="font-size: 40px; color: var(--primary); margin-bottom: 15px; display: block;"></i>
            <h2 style="font-family: 'Orbitron'; font-size: 16px; margin-bottom: 10px;">NOTIF</h2>
            <p id="notifMsg" style="color: #aaa; font-size: 13px; margin-bottom: 20px;">...</p>
            <button class="btn-small" onclick="closeNotif()">OK</button>
        </div>
    </div>

    <div id="home" class="content active">
        <div class="hero-section">
            <div class="main-card">
                <p class="bal-label">Balance</p>
                <div class="bal-amount" id="balanceText">$0.00</div>
                <div class="profit-live">
                    <span id="liveProfit">Calculating...</span>
                </div>
            </div>
        </div>

        <div class="actions-grid">
            <div class="action-item" onclick="switchTab('deposit')"><div class="action-icon"><i class="fas fa-plus"></i></div>Deposit</div>
            <div class="action-item" onclick="switchTab('withdraw')"><div class="action-icon"><i class="fas fa-wallet"></i></div>Withdraw</div>
            <div class="action-item" onclick="switchTab('invest')"><div class="action-icon"><i class="fas fa-chart-line"></i></div>Invest</div>
            <div class="action-item" onclick="alert('Dhawaan...')"><div class="action-icon"><i class="fas fa-history"></i></div>History</div>
        </div>

        <div class="section-title">Active Investments</div>
        <div id="activeAssets" class="asset-list"></div>
    </div>

    <div id="invest" class="content">
        <div class="section-title">Plans</div>
        <div class="plan-scroll" id="planList"></div>
    </div>

    <div id="deposit" class="content">
        <div class="section-title" style="padding-top: 20px;">Deposit</div>
        <div style="padding: 0 20px;">
            <div class="modern-input" style="display: flex; justify-content: space-between; border-color: var(--primary);">
                <span id="evc">618860930</span>
                <span onclick="copy('evc')" style="color: var(--primary); font-weight: 700;">COPY</span>
            </div>
            <input type="text" id="txid" placeholder="Transaction ID" class="modern-input">
            <button class="btn-small" style="padding: 18px;" onclick="doDeposit()">SUBMIT</button>
        </div>
    </div>

    <div id="withdraw" class="content">
        <div class="section-title" style="padding-top: 20px;">Withdraw</div>
        <div style="padding: 0 20px;">
            <input type="number" id="wAmt" placeholder="Amount ($)" class="modern-input">
            <input type="number" id="wPhn" placeholder="Phone Number" class="modern-input">
            <button class="btn-small" style="padding: 18px; background: var(--danger); color: #fff;" onclick="doWithdraw()">WITHDRAW</button>
        </div>
    </div>

    <div id="profile" class="content">
        <div style="text-align: center; padding: 40px 20px;">
            <div style="width: 80px; height: 80px; background: var(--glass); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; border: 1px solid var(--primary);" id="avatar">U</div>
            <h2 id="userName" style="font-size: 18px;">...</h2>
            <p id="userEmail" style="color: #555; font-size: 11px; margin-bottom: 25px;">...</p>
            <button class="btn-small" style="background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 10px 30px;" onclick="auth.signOut()">Logout</button>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', this)"><i class="fas fa-home"></i>Home</div>
        <div class="tab-item" onclick="switchTab('invest', this)"><i class="fas fa-rocket"></i>Invest</div>
        <div class="tab-item" onclick="switchTab('deposit', this)"><i class="fas fa-plus-circle"></i>Deposit</div>
        <div class="tab-item" onclick="switchTab('profile', this)"><i class="fas fa-user"></i>Profile</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();

        let bal = 0, invs = [], curNotif = null, isDataLoaded = false;

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        const d = doc.data();
                        bal = d.balance || 0;
                        invs = d.activeInvestments || [];
                        document.getElementById('balanceText').innerText = "$" + bal.toFixed(2);
                        document.getElementById('userName').innerText = d.fullName || "User";
                        document.getElementById('userEmail').innerText = user.email;
                        document.getElementById('avatar').innerText = (d.fullName ? d.fullName[0] : "U").toUpperCase();
                        isDataLoaded = true;
                        renderAssets();
                    }
                });

                db.collection("notifications").where("userId", "==", user.uid).where("read", "==", false).limit(1).onSnapshot(snap => {
                    const b = document.getElementById('badge');
                    if (!snap.empty) {
                        b.style.display = "block";
                        const d = snap.docs[0];
                        document.getElementById('notifMsg').innerText = d.data().message;
                        curNotif = d.id;
                        document.getElementById('notifModal').style.display = "flex";
                    } else { b.style.display = "none"; }
                });
            } else { window.location.href = "login.html"; }
        });

        function switchTab(id, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
        }

        function closeNotif() {
            if(curNotif) db.collection("notifications").doc(curNotif).update({read: true});
            document.getElementById('notifModal').style.display = "none";
        }

        function openNotif() { 
            const msg = document.getElementById('notifMsg').innerText;
            if(msg !== "...") document.getElementById('notifModal').style.display = "flex"; 
        }

        const plans = [
            {n: "Solar Africa", r: 5.5, m: 10},
            {n: "Geeska Tech", r: 8.5, m: 50},
            {n: "VIP Trade", r: 15.0, m: 200}
        ];

        document.getElementById('planList').innerHTML = plans.map(p => `
            <div class="plan-card">
                <div style="font-size: 11px; color:#666;">${p.n}</div>
                <div class="plan-roi">${p.r}%</div>
                <div style="font-size: 9px; margin-bottom:12px;">Min: $${p.m}</div>
                <button class="btn-small" onclick="investNow('${p.n}', ${p.m}, ${p.r})">INVEST</button>
            </div>
        `).join('');

        async function investNow(n, m, r) {
            if(bal < m) return alert("Haraagaagu kuma filna!");
            if(confirm(`Ma hubtaa $${m} inaad gashanayso?`)) {
                await db.collection("users").doc(auth.currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(-m),
                    activeInvestments: firebase.firestore.FieldValue.arrayUnion({
                        planName: n, amount: Number(m), roi: Number(r), time: Date.now()
                    })
                });
                alert("Guul!");
            }
        }

        function renderAssets() {
            const container = document.getElementById('activeAssets');
            if(invs.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#333; padding:20px; font-size:12px;">Ma jiraan maalgashi.</p>';
                return;
            }
            container.innerHTML = invs.map((v, i) => `
                <div class="asset-card">
                    <div><h4 style="font-size:12px;">${v.planName}</h4><small style="color:#555;">$${v.amount}</small></div>
                    <div id="p-${i}" style="color:var(--primary); font-family:Orbitron; font-size:11px;">+$0.00</div>
                </div>
            `).join('');
        }

        setInterval(() => {
            if(!isDataLoaded || invs.length === 0) {
                document.getElementById('liveProfit').innerText = "+$0.000000";
                return;
            }
            let total = 0;
            invs.forEach((v, i) => {
                const profit = ((Date.now() - v.time)/1000) * ((v.amount * (v.roi/100))/86400);
                if(!isNaN(profit)) {
                    total += profit;
                    const el = document.getElementById(`p-${i}`);
                    if(el) el.innerText = "+$" + profit.toFixed(6);
                }
            });
            document.getElementById('liveProfit').innerText = "+$" + total.toFixed(6);
        }, 1000);

        function copy(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert("Copied!");
        }

        async function doDeposit() {
            const t = document.getElementById('txid').value;
            if(!t) return alert("Geli TID!");
            await db.collection("transactions").add({
                userId: auth.currentUser.uid, type: "Deposit", txid: t, status: "Pending", time: Date.now()
            });
            alert("Codsigaaga waa la diray!");
            document.getElementById('txid').value = "";
        }

        async function doWithdraw() {
            const a = document.getElementById('wAmt').value;
            if(!a || a > bal) return alert("Haraagaagu kuma filna!");
            await db.collection("transactions").add({
                userId: auth.currentUser.uid, type: "Withdraw", amount: Number(a), status: "Pending", time: Date.now()
            });
            alert("Codsigaaga waa la diray!");
            document.getElementById('wAmt').value = "";
        }
    </script>
</body>
</html>

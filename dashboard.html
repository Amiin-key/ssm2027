<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM INVEST | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #0f0f0f; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 30px; }
        header { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .wallet-card { margin: 20px; padding: 30px; background: radial-gradient(circle at top right, #1a1a1a, #050505); border-radius: 30px; text-align: center; border: 1px solid #222; position: relative; }
        .balance { font-size: 45px; font-weight: 900; color: var(--primary); margin: 10px 0; }
        .user-id-box { position: absolute; top: 15px; left: 20px; font-size: 10px; color: #555; font-weight: bold; }
        .pl-badge { display: inline-block; padding: 6px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.05); }
        .collect-box { margin: 0 20px; padding: 20px; background: var(--card); border-radius: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .btn-collect { background: var(--primary); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 20px; }
        .btn-act { background: var(--card); padding: 15px; border-radius: 15px; text-align: center; text-decoration: none; color: #fff; border: 1px solid #222; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 900; color: var(--primary);">SSM INVEST</div>
        <a href="profile.html" style="color:white;"><i class="fas fa-user-circle fa-lg"></i></a>
    </header>

    <div class="wallet-card">
        <div class="user-id-box">ID: <span id="displayId" style="color:#888;">000000000000</span></div>
        <p style="color:#888; font-size: 11px; letter-spacing: 1px; margin-top: 10px;">TOTAL BALANCE</p>
        <div class="balance" id="userBalance">$0.00</div>
        <div class="pl-badge">P/L Performance: <span id="netPL">$0.00</span></div>
    </div>

    <div class="collect-box">
        <div>
            <p style="font-size:10px; color:#888;">LIVE MINING</p>
            <p id="liveProfit" style="font-weight:bold; font-size: 18px; color: #00d4ff;">$0.0000</p>
        </div>
        <button class="btn-collect" onclick="claimProfit()">COLLECT</button>
    </div>

    <div class="actions">
        <a href="deposit.html" class="btn-act"><i class="fas fa-plus"></i><br>Deposit</a>
        <a href="withdraw.html" class="btn-act"><i class="fas fa-minus"></i><br>Withdraw</a>
        <a href="invest.html" class="btn-act"><i class="fas fa-chart-line"></i><br>Invest</a>
    </div>

<script>
    // ... Isticmaal isla Firebase Config-ga sare ...
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('displayId').innerText = data.customId || "12-Digit ID";
                    document.getElementById('userBalance').innerText = "$" + (data.balance || 0).toFixed(2);
                    
                    const net = data.totalProfit || 0;
                    const pl = document.getElementById('netPL');
                    pl.innerText = (net >= 0 ? "+" : "") + "$" + net.toFixed(2);
                    pl.style.color = net >= 0 ? "#00ff88" : "#ff4757";
                }
            });
        } else { window.location.href = "log.html"; }
    });
    // (Ku dar function-ka startProfitEngine iyo claimProfit halkan)
</script>
</body>
</html>

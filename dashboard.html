<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --text-dim: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; padding-bottom: 100px; }

        /* Header Section */
        .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-info h4 { font-size: 0.8rem; color: var(--text-dim); font-weight: 400; }
        .user-info p { font-family: 'Orbitron'; font-size: 1rem; color: var(--primary); }
        .profile-btn { width: 45px; height: 45px; background: var(--card); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #222; color: var(--primary); text-decoration: none; }

        /* Balance Card */
        .balance-card { 
            background: linear-gradient(135deg, #00ff88 0%, #00a35c 100%);
            padding: 30px; border-radius: 30px; color: #000; position: relative;
            overflow: hidden; box-shadow: 0 15px 30px rgba(0, 255, 136, 0.2); margin-bottom: 30px;
        }
        .balance-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .balance-card small { font-weight: 600; opacity: 0.8; font-size: 0.75rem; letter-spacing: 1px; }
        .balance-card h2 { font-family: 'Orbitron'; font-size: 2.2rem; margin: 10px 0; }
        
        /* Action Grid */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .action-item { 
            background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222;
            text-align: center; text-decoration: none; color: #fff; transition: 0.3s;
        }
        .action-item:active { transform: scale(0.95); background: #1a1a1a; }
        .action-item i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
        .action-item span { font-size: 0.8rem; font-weight: 600; }

        /* Stats Section */
        .section-title { font-family: 'Orbitron'; font-size: 0.85rem; margin-bottom: 15px; color: var(--text-dim); letter-spacing: 1px; }
        .stats-box { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #222; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .stat-row:last-child { border-bottom: none; }
        .stat-row span { font-size: 0.85rem; }
        .stat-row .val { color: var(--primary); font-family: 'Orbitron'; }

        /* Bottom Nav */
        .bottom-nav { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; 
            background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px);
            border-radius: 25px; display: flex; justify-content: space-around; 
            padding: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item { color: var(--text-dim); text-decoration: none; font-size: 1.2rem; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="user-bar">
        <div class="user-info">
            <h4>Kusoo dhawaaw,</h4>
            <p id="userName">User</p>
        </div>
        <a href="profile.html" class="profile-btn"><i class="fa-solid fa-user"></i></a>
    </div>

    <div class="balance-card">
        <small>TOTAL BALANCE</small>
        <h2 id="balance">$0.00</h2>
        <div style="font-size: 0.7rem; font-weight: bold;">SSM INVEST GOLD ACCOUNT</div>
    </div>

    <div class="section-title">QUICK ACTIONS</div>
    <div class="action-grid">
        <a href="deposit.html" class="action-item">
            <i class="fa-solid fa-circle-plus"></i>
            <span>Deposit</span>
        </a>
        <a href="withdraw.html" class="action-item">
            <i class="fa-solid fa-money-bill-transfer"></i>
            <span>Withdraw</span>
        </a>
        <a href="history.html" class="action-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>History</span>
        </a>
        <a href="invest.html" class="action-item">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Market</span>
        </a>
    </div>

    <div class="section-title">MY ACCOUNT STATS</div>
    <div class="stats-box">
        <div class="stat-row">
            <span>Status</span>
            <span class="val" style="color: #00ff88;">Active</span>
        </div>
        <div class="stat-row">
            <span>Daily Profit</span>
            <span class="val">+$0.00</span>
        </div>
        <div class="stat-row">
            <span>Total Invested</span>
            <span class="val">$0.00</span>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-house"></i></a>
        <a href="history.html" class="nav-item"><i class="fa-solid fa-list-ul"></i></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-gear"></i></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.firebasestorage.app",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Real-time update loogu talagalay Balance-ka iyo Magaca
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('userName').innerText = data.fullName.split(' ')[0];
                        document.getElementById('balance').innerText = "$" + data.balance.toFixed(2);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>

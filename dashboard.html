<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen">
    
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-500"><i class="fa-solid fa-chart-line mr-2"></i>SSM INVEST</h1>
        <div class="flex items-center space-x-4">
            <a href="profile.html" class="hover:text-blue-400 text-sm flex items-center"><i class="fa-solid fa-user-gear mr-1"></i> Profile</a>
            <button id="logoutBtn" class="bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition-all border border-red-500/30 flex items-center">
                <i class="fa-solid fa-power-off mr-1.5"></i> Ka Bax
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        
        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-xl">
            <h2 class="text-gray-400 text-sm uppercase tracking-wider flex items-center">
                <i class="fa-solid fa-hand-wave mr-2 text-yellow-500"></i>Kusoo dhowaw
            </h2>
            <p id="userName" class="text-2xl font-bold text-white mt-1">Gubaya xogta...</p>
            
            <div class="mt-6 bg-gray-950 p-6 rounded-xl border border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div class="flex items-center space-x-4">
                    <div class="p-4 bg-green-500/10 text-green-500 rounded-xl text-2xl border border-green-500/20">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wider">Haraagaaga (Balance)</p>
                        <p id="userBalance" class="text-3xl font-black text-green-500 mt-0.5">$0.00</p>
                    </div>
                </div>
                <div class="flex space-x-2 w-full sm:w-auto">
                    <a href="deposit.html" class="flex-1 sm:flex-none text-center bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-all flex items-center justify-center">
                        <i class="fa-solid fa-arrow-down-long mr-2"></i> Deposit
                    </a>
                    <a href="withdraw.html" class="flex-1 sm:flex-none text-center bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg font-bold text-sm transition-all flex items-center justify-center">
                        <i class="fa-solid fa-arrow-up-from-bracket mr-2"></i> Withdraw
                    </a>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <a href="invest.html" class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 rounded-2xl p-5 shadow-xl flex items-center justify-between transition-all group">
                <div class="flex items-center space-x-4">
                    <div class="p-4 bg-blue-500/10 text-blue-500 rounded-xl text-xl border border-blue-500/20 group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-money-bill-trend-up"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-lg">Maalgashi (Invest)</h3>
                        <p class="text-xs text-gray-400 mt-0.5">Dooro qorshayaal maalgashi oo faa'iido leh</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-white transition-colors pl-2"></i>
            </a>

            <a href="account_management.html" class="bg-gray-900 border border-gray-800 hover:border-purple-500/50 rounded-2xl p-5 shadow-xl flex items-center justify-between transition-all group">
                <div class="flex items-center space-x-4">
                    <div class="p-4 bg-purple-500/10 text-purple-500 rounded-xl text-xl border border-purple-500/20 group-hover:bg-purple-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-lg">Taariikhda Xisaabta</h3>
                        <p class="text-xs text-gray-400 mt-0.5">Eeg taariikhda Deposit iyo Withdraw</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 group-hover:text-white transition-colors pl-2"></i>
            </a>
        </div>

    </main>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('userName').innerText = data.name;
                    document.getElementById('userBalance').innerText = `$${data.balance.toFixed(2)}`;
                }
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = "login.html");
        });
    </script>
</body>
</html>

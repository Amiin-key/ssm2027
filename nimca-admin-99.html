<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM ADMIN | Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        :root { --primary: #00ff88; --danger: #ff4757; --bg: #050505; --card: #0f0f0f; --text: #ffffff; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-item { background: var(--card); padding: 20px; border-radius: 15px; border-left: 4px solid var(--primary); }
        .stat-item p { font-size: 11px; color: #888; text-transform: uppercase; }
        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .card h3 { font-size: 16px; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #555; font-size: 11px; padding: 10px; border-bottom: 1px solid #222; }
        td { padding: 12px 10px; border-bottom: 1px solid #111; font-size: 13px; }
        .btn { padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 11px; }
        .btn-profit { background: var(--primary); color: #000; }
        .btn-loss { background: var(--danger); color: #fff; }
        .input-field { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; flex: 1; min-width: 200px; }
        .user-tag { background: #1a1a1a; padding: 4px 8px; border-radius: 5px; color: var(--accent); font-family: monospace; }
        .status-pending { color: orange; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header">
        <div style="font-size: 22px; font-weight: 900; color: var(--primary);">SSM ADMIN PANEL</div>
        <button onclick="logout()" style="background:#222; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">Logout</button>
    </header>

    <div class="stats-bar">
        <div class="stat-item"><p>Total Users</p><h2 id="totalUsers">0</h2></div>
        <div class="stat-item" style="border-color:orange;"><p>Withdraw Pending</p><h2 id="pendingWith">0</h2></div>
        <div class="stat-item" style="border-color:var(--accent);"><p>Deposit Pending</p><h2 id="pendingDep">0</h2></div>
    </div>

    <div class="card">
        <h3><i class="fas fa-hand-holding-usd"></i> Manage User Balance</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
            <input type="text" id="targetUid" placeholder="Paste Firebase UID here" class="input-field">
            <input type="number" id="adjAmount" placeholder="Amount ($)" class="input-field">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-profit" style="flex: 1;" onclick="sendPL('profit')">GIVE PROFIT (+)</button>
            <button class="btn btn-loss" style="flex: 1;" onclick="sendPL('loss')">APPLY LOSS (-)</button>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-users"></i> Registered Users (Activity)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>12-Digit ID</th>
                        <th>Firebase UID</th>
                        <th>Balance</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-wallet"></i> Pending Deposits</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>TID</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="depTable"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h3><i class="fas fa-arrow-up"></i> Pending Withdrawals</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Amount</th>
                        <th>Method</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="withTable"></tbody>
            </table>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1. Load All Users
    db.collection("users").onSnapshot(snap => {
        document.getElementById('totalUsers').innerText = snap.size;
        const list = document.getElementById('userList');
        list.innerHTML = "";
        snap.forEach(doc => {
            const u = doc.data();
            list.innerHTML += `
                <tr>
                    <td>${u.fullName || 'N/A'}</td>
                    <td><small>${u.email}</small></td>
                    <td><b style="color:var(--primary)">${u.customId || 'N/A'}</b></td>
                    <td><span class="user-tag" style="font-size:10px;">${doc.id}</span></td>
                    <td>$${(u.balance || 0).toFixed(2)}</td>
                    <td><button class="btn" style="background:#222; color:#fff;" onclick="copyId('${doc.id}')">Select</button></td>
                </tr>`;
        });
    });

    // 2. Load Pending Deposits
    db.collection("transactions").where("status", "==", "Pending").where("type", "==", "Deposit")
    .onSnapshot(snap => {
        document.getElementById('pendingDep').innerText = snap.size;
        const table = document.getElementById('depTable');
        table.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            table.innerHTML += `<tr>
                <td>${d.userId.substring(0,8)}...</td>
                <td>$${d.amount}</td>
                <td>${d.txid}</td>
                <td><button class="btn btn-profit" onclick="approveDeposit('${doc.id}', '${d.userId}', ${d.amount})">Approve</button></td>
            </tr>`;
        });
    });

    // 3. Load Pending Withdrawals
    db.collection("transactions").where("status", "==", "Pending").where("type", "==", "Withdraw")
    .onSnapshot(snap => {
        document.getElementById('pendingWith').innerText = snap.size;
        const table = document.getElementById('withTable');
        table.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            table.innerHTML += `<tr>
                <td>${d.userId.substring(0,8)}...</td>
                <td>$${d.amount}</td>
                <td>${d.method}</td>
                <td>
                    <button class="btn btn-profit" onclick="approveWithdraw('${doc.id}')">OK</button>
                    <button class="btn btn-loss" onclick="rejectWithdraw('${doc.id}', '${d.userId}', ${d.amount})">Reject</button>
                </td>
            </tr>`;
        });
    });

    // Functions
    async function sendPL(type) {
        const id = document.getElementById('targetUid').value.trim();
        let amt = parseFloat(document.getElementById('adjAmount').value);
        if(!id || isNaN(amt)) return alert("Fadlan geli UID iyo Lacag sax ah!");
        const finalAmt = type === 'loss' ? -Math.abs(amt) : Math.abs(amt);
        await db.collection("users").doc(id).update({
            balance: firebase.firestore.FieldValue.increment(finalAmt),
            totalProfit: firebase.firestore.FieldValue.increment(finalAmt)
        });
        alert("Balance-ka waa la cusboonaysiiyay!");
        document.getElementById('adjAmount').value = "";
    }

    async function approveDeposit(id, uId, amt) {
        const batch = db.batch();
        batch.update(db.collection("users").doc(uId), { balance: firebase.firestore.FieldValue.increment(amt) });
        batch.update(db.collection("transactions").doc(id), { status: "Success" });
        await batch.commit();
        alert("Deposit Approved!");
    }

    async function approveWithdraw(id) {
        await db.collection("transactions").doc(id).update({ status: "Success" });
        alert("Withdrawal Approved!");
    }

    async function rejectWithdraw(id, uId, amt) {
        const batch = db.batch();
        batch.update(db.collection("users").doc(uId), { balance: firebase.firestore.FieldValue.increment(amt) });
        batch.update(db.collection("transactions").doc(id), { status: "Rejected" });
        await batch.commit();
        alert("Withdrawal Rejected & Refunded!");
    }

    function copyId(id) {
        document.getElementById('targetUid').value = id;
        window.scrollTo(0,0);
        alert("User Selected!");
    }

    function logout() { firebase.auth().signOut().then(() => window.location.href="log.html"); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM ROOT ADMIN | Ultimate System</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --primary: #00ff88; --danger: #ff4757; --warning: #ffa500; --bg: #050505; --card: #111; --text: #ffffff; --accent: #00d4ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; } /* Laga saaray display:none si uusan u weynaan dhibku */
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 15px; border-left: 5px solid var(--primary); }
        .logo-text { font-family: 'Space Grotesk'; font-weight: 900; color: var(--primary); font-size: 1.2rem; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #222; text-align: center; }
        .stat-box h2 { color: var(--primary); font-size: 1.6rem; margin-top: 5px; }
        .stat-box p { font-size: 0.7rem; color: #888; text-transform: uppercase; }

        .search-area { position: relative; margin-bottom: 20px; }
        .search-area input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
        .search-area input:focus { border-color: var(--primary); }
        .search-area i { position: absolute; right: 15px; top: 18px; color: var(--primary); }

        #userControlPanel { position: sticky; top: 10px; z-index: 100; display: none; border: 2px solid var(--accent); background: #0a0a0a; box-shadow: 0 0 30px rgba(0,0,0,1); }
        
        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .card-title { font-size: 0.85rem; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; text-transform: uppercase; font-weight: bold; border-bottom: 1px solid #222; padding-bottom: 10px; }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; color: #555; font-size: 0.65rem; padding: 12px; text-transform: uppercase; border-bottom: 2px solid #222; }
        td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 0.8rem; }

        .input-field { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; }
        .btn { padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #000; }
    </style>
</head>
<body>

    <div id="adminContent" style="display: none;">
        <header class="header">
            <div class="logo-text"><i class="fas fa-fingerprint"></i> ROOT ACCESS</div>
            <button onclick="logout()" class="btn" style="background:#222; color:#fff;"><i class="fas fa-power-off"></i></button>
        </header>

        <div class="stats-grid">
            <div class="stat-box">
                <p>Pending Deposit</p>
                <h2 id="depCount">0</h2>
            </div>
            <div class="stat-box">
                <p>Pending Withdraw</p>
                <h2 id="witCount">0</h2>
            </div>
        </div>

        <div class="search-area">
            <input type="text" id="userSearch" placeholder="Search User Name or ID..." onkeyup="filterUsers()">
            <i class="fas fa-search"></i>
        </div>

        <div id="userControlPanel" class="card">
            <div class="card-title"><i class="fas fa-user-shield"></i> User Control: <span id="panelUserName" style="color:#fff; margin-left:5px;"></span></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div>
                    <small style="color:#888;">Current Balance</small>
                    <h3 id="panelUserBalance" style="color:var(--primary);">$0.00</h3>
                </div>
                <div>
                    <small style="color:#888;">Account Status</small><br>
                    <span id="panelUserStatus" class="status-pill">Active</span>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="number" id="adjAmt" class="input-field" placeholder="Enter Amount ($)" style="margin-bottom:0;">
                <button class="btn btn-primary" style="flex:1" onclick="submitAdjust(true)">+ Profit</button>
                <button class="btn btn-danger" style="flex:1" onclick="submitAdjust(false)">- Loss</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button id="blockBtn" class="btn btn-warning" onclick="toggleBlock()"><i class="fas fa-ban"></i> Block User</button>
                <button class="btn" style="background:#333; color:#fff;" onclick="hidePanel()">Close Panel</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-spinner fa-spin"></i> Pending Approvals</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Type</th><th>User ID</th><th>Amount</th><th>Ref/Phone</th><th>Action</th></tr>
                    </thead>
                    <tbody id="txList"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-users"></i> Member Database</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>User Details</th><th>Balance</th><th>Status</th><th>Management</th></tr>
                    </thead>
                    <tbody id="userList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const ROOT_EMAIL = "keyamiin811@gmail.com";
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let activeUID = null;
        let activeStatus = "";

        auth.onAuthStateChanged(user => {
            if (user && user.email.toLowerCase() === ROOT_EMAIL.toLowerCase()) {
                document.getElementById("adminContent").style.display = "block";
                startSystem();
            } else {
                window.location.href = "login.html";
            }
        });

        function startSystem() {
            db.collection("transactions").where("status", "==", "Pending").onSnapshot(snap => {
                let d = 0, w = 0;
                const txList = document.getElementById('txList');
                txList.innerHTML = snap.empty ? "<tr><td colspan='5' style='text-align:center; padding:20px; color:#444;'>No pending tasks</td></tr>" : "";
                
                snap.forEach(doc => {
                    const t = doc.data();
                    const amount = parseFloat(t.amount) || 0;
                    t.type === 'Deposit' ? d++ : w++;
                    
                    txList.innerHTML += `<tr>
                        <td><b style="color:${t.type==='Deposit'?'#00ff88':'#ff4757'}">${t.type}</b></td>
                        <td><small>${t.userId ? t.userId.substring(0,8) : 'Unknown'}...</small></td>
                        <td>$${amount.toFixed(2)}</td>
                        <td>${t.txid || t.phone || 'N/A'}</td>
                        <td><button class="btn btn-primary" style="padding:5px 10px" onclick="quickApprove('${doc.id}','${t.userId}',${amount},'${t.type}')">Verify</button></td>
                    </tr>`;
                });
                document.getElementById('depCount').innerText = d;
                document.getElementById('witCount').innerText = w;
            });

            db.collection("users").orderBy("balance", "desc").onSnapshot(snap => {
                const userList = document.getElementById('userList');
                userList.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    const isBlocked = u.status === 'blocked';
                    userList.innerHTML += `<tr>
                        <td><b>${u.fullName || 'No Name'}</b><br><small style="color:#666">${doc.id}</small></td>
                        <td style="color:var(--primary); font-weight:bold;">$${(u.balance || 0).toFixed(2)}</td>
                        <td><span class="status-pill ${isBlocked?'status-blocked':'status-active'}">${isBlocked?'Blocked':'Active'}</span></td>
                        <td><button class="btn btn-primary" onclick="showPanel('${doc.id}')">Manage</button></td>
                    </tr>`;
                });
            });
        }

        async function showPanel(uid) {
            activeUID = uid;
            const doc = await db.collection("users").doc(uid).get();
            const u = doc.data();
            activeStatus = u.status || 'active';

            document.getElementById('panelUserName').innerText = u.fullName || "User";
            document.getElementById('panelUserBalance').innerText = `$${(u.balance || 0).toFixed(2)}`;
            
            const pStatus = document.getElementById('panelUserStatus');
            pStatus.innerText = activeStatus.toUpperCase();
            document.getElementById('blockBtn').innerHTML = activeStatus === 'blocked' ? `<i class="fas fa-unlock"></i> Unblock User` : `<i class="fas fa-ban"></i> Block User`;
            document.getElementById('userControlPanel').style.display = "block";
        }

        async function submitAdjust(isProfit) {
            const amt = parseFloat(document.getElementById('adjAmt').value);
            if (!amt || !activeUID) return alert("Please enter amount");
            const change = isProfit ? amt : -amt;
            await db.collection("users").doc(activeUID).update({
                balance: firebase.firestore.FieldValue.increment(change)
            });
            alert("Success: Balance adjusted.");
            showPanel(activeUID);
            document.getElementById('adjAmt').value = "";
        }

        async function toggleBlock() {
            if (!activeUID) return;
            const nextStatus = activeStatus === 'blocked' ? 'active' : 'blocked';
            await db.collection("users").doc(activeUID).update({ status: nextStatus });
            alert(`User status updated to ${nextStatus.toUpperCase()}`);
            showPanel(activeUID);
        }

        async function quickApprove(id, uid, amt, type) {
            if (!confirm(`Ma hubtaa inaad oggolaato codsigan ${type}?`)) return;
            try {
                if (type === 'Deposit') {
                    const depositAmount = prompt("Geli cadadka lacagta saxda ah ee uu qofku soo diray ($):", amt);
                    if(depositAmount === null || isNaN(parseFloat(depositAmount))) return alert("Codsiga waa la baajiyay. Cadad sax ah lama gelin.");
                    await db.collection("users").doc(uid).update({ balance: firebase.firestore.FieldValue.increment(parseFloat(depositAmount)) });
                } else if (type === 'Withdraw') {
                    // Wixii withdraw ah waxaa toos loogu jarayaa halkan
                    await db.collection("users").doc(uid).update({ balance: firebase.firestore.FieldValue.increment(-amt) });
                }
                await db.collection("transactions").doc(id).update({ status: "Success" });
                alert("Si guul leh ayaa loo ansixiyay!");
            } catch(e) { alert("Khalad: " + e.message); }
        }

        function filterUsers() {
            const val = document.getElementById('userSearch').value.toLowerCase();
            const rows = document.querySelectorAll('#userList tr');
            rows.forEach(row => { row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none"; });
        }
        function hidePanel() { document.getElementById('userControlPanel').style.display = "none"; }
        function logout() { auth.signOut().then(() => window.location.href="login.html"); }
    </script>
</body>
</html>

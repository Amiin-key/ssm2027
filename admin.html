<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM ADMIN | Control Center</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --primary: #00ff88; --danger: #ff4757; --bg: #050505; --card: #0f0f0f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: white; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-item { background: var(--card); padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #111; font-size: 13px; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-approve { background: var(--primary); color: #000; }
        .btn-reject { background: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <header class="header">
        <div style="font-size:20px; font-weight:900; color:var(--primary);">SSM ADMIN PANEL</div>
        <button onclick="auth.signOut()" style="background:#222; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">Logout</button>
    </header>

    <div class="stats-bar">
        <div class="stat-item"><p style="font-size:11px; color:#666;">USERS</p><h2 id="totalUsers">0</h2></div>
        <div class="stat-item" style="border-color:#00d4ff;"><p style="font-size:11px; color:#666;">DEPOSITS</p><h2 id="pendingDep">0</h2></div>
        <div class="stat-item" style="border-color:var(--danger);"><p style="font-size:11px; color:#666;">WITHDRAWS</p><h2 id="pendingWith">0</h2></div>
    </div>

    <div style="background:var(--card); padding:20px; border-radius:15px; border:1px solid #222;">
        <h3 style="color:var(--primary)">Codsiyada Sugaya (Pending Transactions)</h3>
        <table>
            <thead>
                <tr>
                    <th>User</th>
                    <th>Nooca</th>
                    <th>Lacagta</th>
                    <th>Nambar</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="txTable">
                <tr><td colspan="5" style="text-align:center; color:#444;">Ma jirto wax codsi ah...</td></tr>
            </tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if (user && user.email === "keyamiin811@gmail.com") {
            db.collection("users").onSnapshot(snap => { document.getElementById('totalUsers').innerText = snap.size; });
            loadTransactions();
        } else { window.location.href = "log.html"; }
    });

    function loadTransactions() {
        db.collection("transactions").where("status", "==", "Pending").orderBy("date", "desc").onSnapshot(snap => {
            const tbody = document.getElementById('txTable');
            tbody.innerHTML = "";
            let dep = 0, wit = 0;

            if(snap.empty) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#444;">Ma jirto wax codsi ah...</td></tr>`; }

            snap.forEach(doc => {
                const data = doc.data();
                if(data.type === "Deposit") dep++; else wit++;

                tbody.innerHTML += `
                    <tr>
                        <td><b>${data.userName}</b></td>
                        <td>${data.type}</td>
                        <td style="color:var(--primary)">$${data.amount}</td>
                        <td><small>${data.method}<br>${data.txid}</small></td>
                        <td>
                            <button class="btn btn-approve" onclick="manage('${doc.id}', '${data.userId}', ${data.amount}, '${data.type}', 'Approved')">OK</button>
                            <button class="btn btn-reject" onclick="manage('${doc.id}', '${data.userId}', ${data.amount}, '${data.type}', 'Rejected')">X</button>
                        </td>
                    </tr>`;
            });
            document.getElementById('pendingDep').innerText = dep;
            document.getElementById('pendingWith').innerText = wit;
        });
    }

    async function manage(docId, userId, amount, type, status) {
        if(!confirm(`Ma hubtaa inaad ka dhigto ${status}?`)) return;
        try {
            if(type === "Deposit" && status === "Approved") {
                await db.collection("users").doc(userId).update({ balance: firebase.firestore.FieldValue.increment(amount) });
            } else if (type === "Withdraw" && status === "Rejected") {
                await db.collection("users").doc(userId).update({ balance: firebase.firestore.FieldValue.increment(amount) });
            }
            await db.collection("transactions").doc(docId).update({ status: status });
            alert("Guul!");
        } catch(e) { alert(e.message); }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Qaybta Maamulka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-red-500"><i class="fa-solid fa-shield-halved mr-2"></i> SSM Admin Panel</h1>
        <button id="logoutBtn" class="text-sm bg-red-600/20 text-red-500 hover:bg-red-600 hover:text-white px-4 py-2 rounded-xl border border-red-500/30 transition-all">
            Ka Bax
        </button>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        
        <!-- Raadinta Macmiilka -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-md font-bold text-gray-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-magnifying-glass mr-2 text-blue-500"></i> Raadi Macmiil (User ID)</h2>
            <div class="flex gap-2">
                <input type="text" id="searchUserId" placeholder="Geli ID-ga (Tusaale: SSM-1234)" class="flex-1 bg-gray-950 rounded-xl px-4 py-3 border border-gray-800 focus:outline-none focus:border-blue-500 font-mono text-white">
                <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 font-bold px-6 py-3 rounded-xl transition-all">Raadi</button>
            </div>
        </div>

        <!-- Natiijada Raadinta -->
        <div id="userResultBox" class="hidden bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="border-b border-gray-800 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h3 id="resName" class="text-2xl font-bold text-white">---</h3>
                    <p id="resEmail" class="text-sm text-gray-500 font-mono">---</p>
                    <p class="text-xs text-blue-400 font-bold mt-1">ID: <span id="resIdCard" class="font-mono">---</span></p>
                </div>
                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 text-right">
                    <p class="text-xs text-gray-500 uppercase">Haraaga Hadda</p>
                    <p id="resBalance" class="text-2xl font-black text-green-500">$0.00</p>
                </div>
            </div>

            <!-- Maamulidda Balance-ka -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-2">
                    <label class="block text-xs text-gray-400 font-bold uppercase">Wax kabi Haraaga ($)</label>
                    <div class="flex gap-2">
                        <input type="number" id="updateAmount" placeholder="Cadadka" class="w-full bg-gray-900 rounded-lg px-3 py-2 border border-gray-800 font-mono text-white focus:outline-none">
                        <button id="addBalBtn" class="bg-green-600 hover:bg-green-700 text-xs font-bold px-4 py-2 rounded-lg text-white">Add</button>
                        <button id="subBalBtn" class="bg-red-600 hover:bg-red-700 text-xs font-bold px-4 py-2 rounded-lg text-white">Cut</button>
                    </div>
                </div>

                <div class="bg-gray-950 p-4 rounded-xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-bold uppercase mb-1">Qorshaha Maalgashiga (Plan)</p>
                    <div class="flex items-center space-x-2 text-yellow-500 mt-2">
                        <i class="fa-solid fa-gem text-lg"></i>
                        <span id="resPlan" class="font-bold text-md text-white">Ma jiro qorshe firfircoon</span>
                    </div>
                </div>
            </div>

            <!-- Taariikhda 24 Saac ee u dambeysay -->
            <div>
                <h4 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3"><i class="fa-solid fa-clock-rotate-left mr-2 text-red-500"></i> Taariikhda Lacagaha (24 Saac ee u dambeeyay)</h4>
                <div class="overflow-hidden border border-gray-800 rounded-xl bg-gray-950">
                    <div class="p-3 bg-gray-900 text-xs font-bold text-gray-400 uppercase grid grid-cols-3">
                        <div>Nooca / Habka</div>
                        <div class="text-center">Cadadka</div>
                        <div class="text-right">Xaaladda</div>
                    </div>
                    <div id="adminHistoryList" class="divide-y divide-gray-800/60 text-sm">
                        <!-- Xogta waxaa lagu shubayaa dynamic -->
                        <div class="p-4 text-center text-gray-500">Ma jirto wax xog ah oo la helay 24-kii saac u dambeeyay.</div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { collection, query, where, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        let currentSelectedUserUid = null;
        let currentSelectedUserBalance = 0;

        // Raadi User-ka
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const searchId = document.getElementById('searchUserId').value.trim().toUpperCase();
            if(!searchId) return;

            try {
                const q = query(collection(db, "users"), where("userIdNo", "==", searchId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    Swal.fire({ icon: 'error', title: 'Lama Helin', text: 'Ma jiro qof leh ID-gan.', background: '#111827', color: '#fff' });
                    document.getElementById('userResultBox').classList.add('hidden');
                    return;
                }

                querySnapshot.forEach((userSnapshot) => {
                    currentSelectedUserUid = userSnapshot.id;
                    const data = userSnapshot.data();
                    currentSelectedUserBalance = data.balance || 0;

                    document.getElementById('resName').innerText = data.name || "User";
                    document.getElementById('resEmail').innerText = data.email || "---";
                    document.getElementById('resIdCard').innerText = data.userIdNo || "---";
                    document.getElementById('resBalance').innerText = `$${currentSelectedUserBalance.toFixed(2)}`;
                    
                    document.getElementById('userResultBox').classList.remove('hidden');
                    loadUserHistory24h(currentSelectedUserUid);
                });

                // Soo jiid Qorshaha Maalgashi (Haddii uu jiro)
                const investQuery = query(collection(db, "investments"), where("userId", "==", currentSelectedUserUid), where("status", "==", "Active"));
                const investSnapshot = await getDocs(investQuery);
                if(!investSnapshot.empty) {
                    investSnapshot.forEach(doc => {
                        document.getElementById('resPlan').innerText = `${doc.data().planName} ($${doc.data().amount})`;
                    });
                } else {
                    document.getElementById('resPlan').innerText = "Ma jiro qorshe firfircoon";
                }

            } catch (err) {
                console.error(err);
            }
        });

        // Load 24 Hours History
        async function loadUserHistory24h(uid) {
            const historyList = document.getElementById('adminHistoryList');
            historyList.innerHTML = "";

            try {
                const q = query(collection(db, "transactions"), where("userId", "==", uid));
                const snapshot = await getDocs(q);
                
                let count = 0;
                const limitTime = Date.now() - (24 * 60 * 60 * 1000); // 24 saac ka hor

                snapshot.forEach(txDoc => {
                    const tx = txDoc.data();
                    let txDate = tx.date ? tx.date.toDate().getTime() : Date.now();

                    if (txDate >= limitTime) {
                        count++;
                        const div = document.createElement('div');
                        div.className = "p-3 grid grid-cols-3 items-center hover:bg-gray-900/40 transition-colors";
                        div.innerHTML = `
                            <div>
                                <p class="font-bold text-white text-xs">${tx.type || 'Transaction'}</p>
                                <p class="text-[10px] text-gray-500">${tx.method || 'Mobile'}</p>
                            </div>
                            <div class="text-center font-mono font-bold ${tx.type === 'Deposit' ? 'text-green-500' : 'text-red-500'}">$${tx.amount}</div>
                            <div class="text-right text-xs font-bold text-yellow-500">${tx.status || 'Pending'}</div>
                        `;
                        historyList.appendChild(div);
                    }
                });

                if(count === 0) {
                    historyList.innerHTML = `<div class="p-4 text-center text-gray-500">Ma jirto wax lacag ah oo la dhigay ama la bixiyey 24-kii saac u dambeeyay.</div>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Add Balance
        document.getElementById('addBalBtn').addEventListener('click', async () => {
            const val = parseFloat(document.getElementById('updateAmount').value);
            if(!val || val <= 0 || !currentSelectedUserUid) return;

            newBalance = currentSelectedUserBalance + val;
            await updateDoc(doc(db, "users", currentSelectedUserUid), { balance: newBalance });
            currentSelectedUserBalance = newBalance;
            document.getElementById('resBalance').innerText = `$${newBalance.toFixed(2)}`;
            Swal.fire({ icon: 'success', title: 'Waa lagu daray!', background: '#111827', color: '#fff' });
        });

        // Cut Balance
        document.getElementById('subBalBtn').addEventListener('click', async () => {
            const val = parseFloat(document.getElementById('updateAmount').value);
            if(!val || val <= 0 || !currentSelectedUserUid) return;

            newBalance = currentSelectedUserBalance - val;
            if(newBalance < 0) newBalance = 0;
            await updateDoc(doc(db, "users", currentSelectedUserUid), { balance: newBalance });
            currentSelectedUserBalance = newBalance;
            document.getElementById('resBalance').innerText = `$${newBalance.toFixed(2)}`;
            Swal.fire({ icon: 'success', title: 'Waa laga gooyay!', background: '#111827', color: '#fff' });
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = "login.html");
        });
    </script>
</body>
</html>

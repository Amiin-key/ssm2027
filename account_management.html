<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Maamulka Xisaabta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-500"><i class="fa-solid fa-user-gear mr-2"></i> Account History</h1>
        <a href="dashboard.html" class="text-sm bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-xl border border-gray-700 transition-all flex items-center">
            <i class="fa-solid fa-house mr-2"></i> Dashboard
        </a>
    </nav>

    <main class="max-w-md mx-auto px-4 py-8 space-y-6">
        <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4">
            <h3 class="text-sm font-bold text-gray-400 mb-3 uppercase tracking-wider">Dhamaan Dhaqdhaqaaqa Xisaabta</h3>
            <div id="txHistoryBox" class="space-y-2">Loading transactions...</div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        auth.onAuthStateChanged(user => {
            if(user) {
                const q = query(collection(db, "transactions"), where("userId", "==", user.uid));
                onSnapshot(q, (snapshot) => {
                    const box = document.getElementById('txHistoryBox');
                    box.innerHTML = snapshot.empty ? "<p class='text-xs text-gray-500'>Weli wax dhaqdhaqaaq ah ma sameyn.</p>" : "";
                    snapshot.forEach(doc => {
                        const tx = doc.data();
                        const isDep = tx.type === 'Deposit';
                        box.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-950 p-3 rounded-xl border border-gray-800 text-xs">
                            <div>
                                <p class="font-bold">${tx.type} (${tx.method || 'Mobile'})</p>
                                <p class="text-gray-500 font-mono">${tx.txid || ''}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-black ${isDep?'text-green-500':'text-red-500'}">${isDep?'+':'-'}$${tx.amount.toFixed(2)}</p>
                                <p class="text-gray-400 text-[10px]">${tx.status}</p>
                            </div>
                        </div>`;
                    });
                });
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>

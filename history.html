<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Transaction History</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --text-dim: #888; --pending: #f1c40f; --success: #2ecc71; --danger: #e74c3c; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }

        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-nav a { 
            color: #fff; text-decoration: none; font-size: 1.1rem; 
            background: var(--card); width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 12px; border: 1px solid #222;
        }

        .filter-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { 
            padding: 8px 15px; background: #111; border: 1px solid #222; 
            border-radius: 10px; font-size: 0.75rem; white-space: nowrap; color: var(--text-dim);
        }
        .tab.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }

        .history-list { display: flex; flex-direction: column; gap: 12px; }
        .history-item { 
            background: var(--card); padding: 15px; border-radius: 18px; 
            border: 1px solid #222; display: flex; align-items: center; justify-content: space-between;
        }
        
        .item-left { display: flex; align-items: center; gap: 12px; }
        .icon-box { 
            width: 45px; height: 45px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .dep-bg { background: rgba(46, 204, 113, 0.1); color: var(--success); }
        .wit-bg { background: rgba(231, 76, 60, 0.1); color: var(--danger); }

        .details h4 { font-size: 0.9rem; margin-bottom: 2px; }
        .details p { font-size: 0.7rem; color: var(--text-dim); }

        .item-right { text-align: right; }
        .item-right .amount { font-family: 'Orbitron'; font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; display: block; }
        .status-badge { font-size: 0.6rem; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; font-weight: bold; }
        
        .status-pending { background: rgba(241, 196, 15, 0.1); color: var(--pending); }
        .status-completed { background: rgba(46, 204, 113, 0.1); color: var(--success); }
        
        #no-data { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 0.8rem; display: none; }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 0.9rem;">TRANSACTIONS</h2>
    </div>

    <div class="filter-tabs">
        <div class="tab active">Dhammaan</div>
        <div class="tab">Deposits</div>
        <div class="tab">Withdraws</div>
    </div>

    <div id="no-data">
        <i class="fa-solid fa-folder-open" style="font-size: 3rem; margin-bottom: 10px; opacity: 0.2;"></i>
        <p>Wali wax dhaqdhaqaaq ah ma jiraan.</p>
    </div>

    <div class="history-list" id="historyList">
        <!-- Transactions will appear here -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.firebasestorage.app",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadHistory(user.uid);
            } else { window.location.href = "login.html"; }
        });

        function loadHistory(uid) {
            const q = query(
                collection(db, "transactions"),
                where("userId", "==", uid),
                orderBy("time", "desc")
            );

            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('historyList');
                const noData = document.getElementById('no-data');
                list.innerHTML = "";

                if (snapshot.empty) {
                    noData.style.display = "block";
                    return;
                }

                noData.style.display = "none";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const date = new Date(data.time).toLocaleDateString();
                    const isDep = data.type === "Deposit";
                    
                    const html = `
                        <div class="history-item">
                            <div class="item-left">
                                <div class="icon-box ${isDep ? 'dep-bg' : 'wit-bg'}">
                                    <i class="fa-solid ${isDep ? 'fa-arrow-down-left' : 'fa-arrow-up-right'}"></i>
                                </div>
                                <div class="details">
                                    <h4>${data.type}</h4>
                                    <p>${date}</p>
                                </div>
                            </div>
                            <div class="item-right">
                                <span class="amount" style="color: ${isDep ? 'var(--success)' : 'var(--danger)'}">
                                    ${isDep ? '+' : '-'}$${data.amount.toFixed(2)}
                                </span>
                                <span class="status-badge status-${data.status.toLowerCase()}">${data.status}</span>
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });
            });
        }
    </script>
</body>
</html>

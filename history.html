<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --withdraw: #ff4757;
            --invest: #00d4ff;
            --bg: #030303;
            --card: #0d0d0d;
            --border: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; }

        /* HEADER */
        header {
            padding: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 19px; font-weight: 600; flex-grow: 1; text-align: center; margin-right: 35px; }
        .back-btn { 
            width: 38px; height: 38px; background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none;
        }

        .container { padding: 20px; }

        /* TX STATS MINI CARD */
        .history-header {
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
            padding: 20px; border-radius: 25px; border: 1px solid var(--border);
            margin-bottom: 25px; display: flex; justify-content: space-around;
            text-align: center;
        }
        .stat-box p { font-size: 10px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box h3 { font-family: 'Orbitron', sans-serif; font-size: 14px; }

        /* TRANSACTION ITEM */
        .tx-card {
            background: var(--card);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            transition: 0.3s;
            animation: slideIn 0.5s ease-out forwards;
            opacity: 0;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .tx-icon {
            width: 48px; height: 48px;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            margin-right: 15px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .type-deposit { background: rgba(0, 255, 136, 0.08); color: var(--primary); }
        .type-withdraw { background: rgba(255, 71, 87, 0.08); color: var(--withdraw); }
        .type-investment { background: rgba(0, 212, 255, 0.08); color: var(--invest); }

        .tx-info { flex-grow: 1; }
        .tx-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .tx-info p { font-size: 11px; color: #555; }

        .tx-amount { text-align: right; }
        .tx-amount h4 { font-family: 'Orbitron', sans-serif; font-size: 14px; margin-bottom: 5px; }
        
        .status-pill {
            font-size: 9px; padding: 3px 10px; border-radius: 50px;
            font-weight: 700; text-transform: uppercase;
        }
        .status-pending { background: rgba(255, 165, 0, 0.15); color: #ffa500; }
        .status-success { background: rgba(0, 255, 136, 0.15); color: var(--primary); }
        .status-failed { background: rgba(255, 71, 87, 0.15); color: var(--withdraw); }

        /* LOADING & EMPTY */
        .loader-box { text-align: center; margin-top: 60px; color: var(--primary); }
        .empty-box { text-align: center; margin-top: 80px; opacity: 0.3; }
        .empty-box i { font-size: 60px; margin-bottom: 15px; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; padding: 15px;
            border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-item { color: #444; text-decoration: none; text-align: center; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1>Activities</h1>
    </header>

    <div class="container">
        <div class="history-header">
            <div class="stat-box">
                <p>Deposits</p>
                <h3 id="totalDep" style="color: var(--primary);">$0</h3>
            </div>
            <div class="stat-box">
                <p>Withdrawals</p>
                <h3 id="totalWith" style="color: var(--withdraw);">$0</h3>
            </div>
        </div>

        <div id="txList">
            <div class="loader-box" id="loader">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px; font-size: 12px;">Loading history...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="invest.html" class="nav-item"><i class="fas fa-rocket"></i><span>Invest</span></a>
        <a href="history.html" class="nav-item active"><i class="fas fa-history"></i><span>History</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i><span>Profile</span></a>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if (user) {
            loadTransactions(user.uid);
        } else {
            window.location.href = "log.html";
        }
    });

    async function loadTransactions(uid) {
        const txList = document.getElementById('txList');
        const loader = document.getElementById('loader');
        
        let depTotal = 0;
        let withTotal = 0;

        try {
            const snapshot = await db.collection("transactions")
                .where("userId", "==", uid)
                .orderBy("timestamp", "desc") // Hubi inuu magaca timestamp yahay sidii hore
                .get();

            loader.style.display = 'none';

            if (snapshot.empty) {
                txList.innerHTML = `
                    <div class="empty-box">
                        <i class="fas fa-receipt"></i>
                        <p>No transactions found yet.</p>
                    </div>`;
                return;
            }

            let html = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleDateString('en-GB') : "Processing";
                
                let icon = "fa-plus";
                let typeClass = "type-deposit";
                let prefix = "+";
                let amtColor = "var(--primary)";

                if(data.type === "Withdraw") {
                    icon = "fa-arrow-up";
                    typeClass = "type-withdraw";
                    prefix = "-";
                    amtColor = "var(--withdraw)";
                    if(data.status === "Success") withTotal += data.amount;
                } else if(data.type === "Investment") {
                    icon = "fa-rocket";
                    typeClass = "type-investment";
                    prefix = "-";
                    amtColor = "var(--invest)";
                } else {
                    if(data.status === "Success") depTotal += data.amount;
                }

                const statusClass = data.status.toLowerCase() === 'pending' ? 'status-pending' : 
                                   data.status.toLowerCase() === 'success' ? 'status-success' : 'status-failed';

                html += `
                    <div class="tx-card">
                        <div class="tx-icon ${typeClass}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="tx-info">
                            <h4>${data.type} ${data.plan || ''}</h4>
                            <p>${date} • ${data.method || 'Account'}</p>
                        </div>
                        <div class="tx-amount">
                            <h4 style="color: ${amtColor}">${prefix}$${data.amount.toFixed(2)}</h4>
                            <span class="status-pill ${statusClass}">${data.status}</span>
                        </div>
                    </div>
                `;
            });

            txList.innerHTML = html;
            document.getElementById('totalDep').innerText = "$" + depTotal.toFixed(0);
            document.getElementById('totalWith').innerText = "$" + withTotal.toFixed(0);

        } catch (err) {
            console.error(err);
            txList.innerHTML = "<p style='color:#ff4757; text-align:center;'>Cilad ayaa dhacday: " + err.message + "</p>";
        }
    }
</script>
</body>
</html>

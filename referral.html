<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Referral Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }

        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .back-nav a { color: #fff; text-decoration: none; width: 40px; height: 40px; background: var(--card); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #222; }

        .refer-card {
            background: linear-gradient(135deg, #111, #000);
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            border: 1px solid #222;
            margin-bottom: 25px;
        }

        .refer-card i { font-size: 3rem; color: var(--primary); margin-bottom: 15px; }
        .refer-card h2 { font-family: 'Orbitron'; font-size: 1.1rem; margin-bottom: 10px; }
        .refer-card p { font-size: 0.8rem; color: #666; margin-bottom: 20px; }

        .link-box {
            background: #000;
            border: 1px dashed #333;
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--primary);
            word-break: break-all;
        }

        .copy-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .stat-box h3 { font-family: 'Orbitron'; font-size: 1.2rem; color: var(--primary); }
        .stat-box small { font-size: 0.7rem; color: #555; text-transform: uppercase; }

        .ref-list-title { font-family: 'Orbitron'; font-size: 0.8rem; color: #444; margin-bottom: 15px; padding-left: 5px; }
        .ref-user {
            background: var(--card);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #111;
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 1rem;">REFERRAL</h2>
    </div>

    <div class="refer-card">
        <i class="fa-solid fa-gift"></i>
        <h2>CASUUM SAAXIIB</h2>
        <p>Nuqul ka qaado link-gaaga hoose, la wadaag saaxiibadaa oo hel gunno maalgashi markay ku biiraan.</p>
        
        <div class="link-box">
            <span id="ref-link">Loading link...</span>
            <button class="copy-btn" onclick="copyLink()">COPY</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <small>Total Invited</small>
            <h3 id="total-ref">0</h3>
        </div>
        <div class="stat-box">
            <small>Earnings</small>
            <h3 id="ref-earnings">$0.00</h3>
        </div>
    </div>

    <h3 class="ref-list-title">MY REFERRALS</h3>
    <div id="ref-list-container">
        <p style="text-align: center; color: #333; font-size: 0.8rem; margin-top: 20px;">Ma jiraan dad aad casuuntay weli.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Samee Link-ga (U bedel domain-kaaga dhabta ah hadhow)
                const myUrl = window.location.origin + "/register.html?ref=" + user.uid;
                document.getElementById('ref-link').innerText = myUrl;

                // 1. Soo jiid tirada dadka uu casuumay
                const q = query(collection(db, "users"), where("referredBy", "==", user.uid));
                onSnapshot(q, (snapshot) => {
                    document.getElementById('total-ref').innerText = snapshot.size;
                    const listContainer = document.getElementById('ref-list-container');
                    
                    if (!snapshot.empty) {
                        listContainer.innerHTML = "";
                        snapshot.forEach((doc) => {
                            const userData = doc.data();
                            listContainer.innerHTML += `
                                <div class="ref-user">
                                    <div style="font-size: 0.85rem;">${userData.fullName || 'User'}</div>
                                    <div style="font-size: 0.7rem; color: var(--primary);">Verified</div>
                                </div>
                            `;
                        });
                    }
                });

                // 2. Soo jiid inta uu ka helay casuumadda (Referral Earnings)
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    if (doc.exists()) {
                        document.getElementById('ref-earnings').innerText = "$" + (doc.data().refEarnings || 0).toFixed(2);
                    }
                });

            } else {
                window.location.href = "login.html";
            }
        });

        window.copyLink = function() {
            const linkText = document.getElementById('ref-link').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Referral link-gaaga waa la nuqulay!");
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM GLOBAL | Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; margin: 0; }
        .hero { padding: 20px; }
        .logo-icon { font-size: 4rem; color: var(--primary); margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(0,255,136,0.5)); }
        h1 { font-family: 'Orbitron'; letter-spacing: 2px; margin-bottom: 10px; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 40px; }
        .btn { display: block; width: 100%; max-width: 280px; padding: 15px; margin: 10px auto; border-radius: 15px; font-weight: bold; text-decoration: none; font-family: 'Orbitron'; font-size: 0.8rem; transition: 0.3s; }
        .btn-start { background: var(--primary); color: #000; }
        .btn-learn { border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>
    <div class="hero">
        <i class="fa-solid fa-rocket logo-icon"></i>
        <h1>SSM <span style="color: var(--primary)">GLOBAL</span></h1>
        <p>Maalgashiga mustaqbalka wuxuu ka bilaawdaa halkan.<br>Ammaan, Fudud, iyo Degdeg.</p>
        <a href="login.html" class="btn btn-start">GET STARTED <i class="fa-solid fa-chevron-right"></i></a>
        <a href="#" class="btn btn-learn">LEARN MORE</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => { if (user) window.location.href = "dashboard.html"; });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM INVEST | Maalgashiga Geeska Afrika</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --primary: #00ff88; --bg: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: white; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; background: radial-gradient(circle at center, #111, #050505); }
        .hero h1 { font-size: 50px; font-weight: 900; margin-bottom: 20px; line-height: 1.1; }
        .hero span { color: var(--primary); }
        .hero p { color: #888; max-width: 500px; margin-bottom: 30px; font-size: 16px; }
        .cta-btns { display: flex; gap: 15px; }
        .btn { padding: 15px 30px; border-radius: 12px; font-weight: 900; text-decoration: none; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-outline { border: 1px solid #333; color: #fff; }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,136,0.2); }
    </style>
</head>
<body>
    <div class="hero">
        <div style="color:var(--primary); font-weight:bold; letter-spacing:3px; margin-bottom:10px;">WELCOME TO SSM 2027</div>
        <h1>Maalgashiga <span>Mustaqbalka</span> ee Soomaaliya</h1>
        <p>Ku biir kunka qof ee maalin walba faa'iidada ka hela shirkadda ugu weyn Geeska Afrika. Amni, Kalsooni, iyo Horumar.</p>
        <div class="cta-btns">
            <a href="reg.html" class="btn btn-primary">BILOW HADDA</a>
            <a href="log.html" class="btn btn-outline">SOO GALI</a>
        </div>
    </div>
    
    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com", // Waa inuu sax yahay
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userData = {};
    let profitToClaim = 0;

    // HUBI INUU QOFKA SOO GALAY (AUTH CHECK)
    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    userData = doc.data();
                    updateUI();
                }
            });
        } else {
            window.location.href = "log.html"; // Haddii uusan soo gelin, dib u celi
        }
    });

    function updateUI() {
        document.getElementById('userBalance').innerText = "$" + (userData.balance || 0).toFixed(2);
        document.getElementById('userInitials').innerText = userData.fullName ? userData.fullName.charAt(0).toUpperCase() : "U";
        startProfitEngine();
    }

    function startProfitEngine() {
        if (!userData.activeInvestments || userData.activeInvestments.length === 0) return;
        
        setInterval(() => {
            let total = 0;
            const now = new Date().getTime();
            userData.activeInvestments.forEach(plan => {
                const sec = (now - plan.startTime) / 1000;
                // Xisaabinta faa'iidada ilbiriqsi kasta
                total += (sec * ((plan.amount * plan.dailyRate) / 86400));
            });
            profitToClaim = total;
            document.getElementById('liveProfit').innerText = "+$" + total.toFixed(4);
            document.getElementById('pendingDisplay').innerText = "$" + total.toFixed(2);
        }, 1000);
    }

    async function claimProfit() {
        if (profitToClaim <= 0) {
            alert("Ma jirto faa'iido aad claim garaysan karto hadda.");
            return;
        }
        const user = auth.currentUser;
        const newStartTime = new Date().getTime();
        
        // Cusboonaysii waqtiga maalgashiga si uu dib uga bilaabo 0
        const updatedInvestments = userData.activeInvestments.map(p => ({
            ...p, 
            startTime: newStartTime 
        }));
        
        try {
            await db.collection("users").doc(user.uid).update({
                balance: firebase.firestore.FieldValue.increment(profitToClaim),
                activeInvestments: updatedInvestments
            });
            alert("Faa'iidada waa lagu daray balance-kaaga!");
        } catch (err) {
            console.error("Cilad dhacday:", err);
        }
    }
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM INVESTMENTS | Maalgashi Iyo Koobaa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-gray-950 text-white flex flex-col items-center justify-center min-h-screen px-4">
    <div class="text-center max-w-md w-full">
        
        <div class="inline-flex items-center justify-center w-24 h-24 bg-gray-900 border border-gray-800 rounded-2xl p-2 mb-6 shadow-2xl animate-pulse">
            <img src="logo.png" alt="SSM Logo" class="w-full h-full object-contain rounded-xl">
        </div>
        
        <h1 class="text-3xl font-black text-white mb-2 tracking-wide uppercase">SSM INVESTMENTS</h1>
        <p class="text-xs text-yellow-500 font-medium tracking-widest uppercase mb-4">Maalgashi Iyo Koobaa</p>
        <p class="text-sm text-gray-400 mb-8 max-w-xs mx-auto">Ku billow maalgashigaaga maanta si ammaan ah oo kalsooni leh.</p>
        
        <div class="space-y-4">
            <a href="login.html" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg text-center text-sm uppercase tracking-wider">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Gari xisaabtaada (Login)
            </a>
            <a href="register.html" class="block w-full bg-gray-900 hover:bg-gray-700 text-white font-bold py-3.5 rounded-xl transition-all border border-gray-800 text-center text-sm uppercase tracking-wider">
                <i class="fa-solid fa-user-plus mr-2"></i> Samayso Xisaab Cusub
            </a>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log("PWA Ready! Registered successfully:", reg.scope))
                    .catch(err => console.error("Service Worker failed:", err));
            });
        }
    </script>
</body>
</html>

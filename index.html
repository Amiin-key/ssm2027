            padding: 20px;

            text-transform: uppercase;
            transition: 0.3s;
            cursor: pointer;
            border: none;

        .btn-main {

            box-shadow: 0 10px 20px var(--primary-glow);
        }

        .btn-sec {
            background: var(--glass);
            color: #fff;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .stats {
            margin-top: 60px;
            display: flex;
            gap: 40px;
            justify-content: center;
        }

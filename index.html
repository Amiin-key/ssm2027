<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM INVEST | Maalgashiga Geeska Afrika</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); color: white; }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; background: radial-gradient(circle at center, #111, #050505); }
        .hero h1 { font-size: 42px; font-weight: 900; margin-bottom: 20px; line-height: 1.2; }
        .hero span { color: var(--primary); }
        .hero p { color: #888; max-width: 500px; margin-bottom: 30px; font-size: 16px; }
        .cta-btns { display: flex; gap: 15px; }
        .btn { padding: 15px 30px; border-radius: 12px; font-weight: 900; text-decoration: none; transition: 0.3s; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-outline { border: 1px solid #333; color: #fff; }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,255,136,0.2); }
        
        /* Badhanka Soo degshada App-ka */
        #pwaInstallBtn { display: none; margin-top: 20px; background: #00d4ff; color: #000; }
    </style>
</head>
<body>
    <div class="hero">
        <div style="color:var(--primary); font-weight:bold; letter-spacing:3px; margin-bottom:10px;">WELCOME TO SSM 2027</div>
        <h1>Maalgashiga <span>Mustaqbalka</span> ee Soomaaliya</h1>
        <p>Ku biir kunka qof ee maalin walba faa'iidada ka hela shirkadda ugu weyn Geeska Afrika. Amni, Kalsooni, iyo Horumar.</p>
        <div class="cta-btns">
            <a href="reg.html" class="btn btn-primary">BILOW HADDA</a>
            <a href="log.html" class="btn btn-outline">SOO GALI</a>
        </div>
        <button id="pwaInstallBtn" class="btn"><i class="fas fa-download"></i> SOO DEGSO APP-KA</button>
    </div>
    
    <script>
        // IS-DIIWAANGELINTA SERVICE WORKER
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("PWA: Service Worker Is Registered!"))
            .catch(err => console.error("PWA Error:", err));
        }

        // Maareynta Soo-degshada App-ka (Install Prompt)
        let deferredPrompt;
        const installBtn = document.getElementById('pwaInstallBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Muuji badhanka haddii moobilku oggol yahay
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>

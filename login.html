<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-2xl">
        
        <div class="text-center mb-6">
            <img src="logo.png" alt="SSM Logo" class="h-16 mx-auto object-contain mb-2 rounded-xl">
            <h2 class="text-2xl font-bold text-blue-500"><i class="fa-solid fa-unlock-keyhole mr-2"></i>Welcome Back</h2>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="loginEmail" required class="w-full bg-gray-800 rounded-lg pl-10 pr-4 py-3 border border-gray-700 focus:outline-none focus:border-blue-500 text-white">
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="loginPassword" required class="w-full bg-gray-800 rounded-lg pl-10 pr-12 py-3 border border-gray-700 focus:outline-none focus:border-blue-500 text-white">
                    <button type="button" id="toggleLoginPassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-white">
                        <i class="fa-solid fa-eye" id="loginEyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold transition-all flex justify-center items-center">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In
            </button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-400">Miyaanad haysan xisaab? <a href="register.html" class="text-blue-500 hover:underline">Is-diiwaangeli</a></p>
    </div>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // Show/Hide Password Logic
        const toggleLoginPassword = document.getElementById('toggleLoginPassword');
        const loginPasswordInput = document.getElementById('loginPassword');
        const loginEyeIcon = document.getElementById('loginEyeIcon');

        toggleLoginPassword.addEventListener('click', () => {
            const type = loginPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPasswordInput.setAttribute('type', type);
            loginEyeIcon.classList.toggle('fa-eye');
            loginEyeIcon.classList.toggle('fa-eye-slash');
        });

        // Login Form Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                if(!navigator.onLine) throw new Error("Internet-kaaga ayaa go'an.");

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Hubi Shuruudaha rasmiga ah ee Admin-ka gaarka ah
                if (email === "keyamiin811@gmail.com" && password === "Raxmaan$78#") {
                    // Toos u cusbooneysii Firestore horta si loogu aqoonsado admin
                    await updateDoc(doc(db, "users", user.uid), { role: "admin" });
                    window.location.href = "admin.html";
                    return;
                }

                // Wuxuu u gudbiyaa haddii kale dashboard-ka dadka caadiga ah
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === "admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }

            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Login Khasaaray', text: error.message, background: '#111827', color: '#fff', confirmButtonColor: '#d33' });
            }
        });
    </script>
</body>
</html>

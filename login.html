<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #000000;
            --card: #121212;
            --input-bg: #080808;
            --text-gray: #888888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            padding: 50px 30px;
            border-radius: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #1e1e1e;
        }

        h2 {
            font-family: 'Orbitron';
            color: var(--primary);
            margin-bottom: 40px;
            font-size: 24px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-group { position: relative; width: 100%; margin-bottom: 18px; }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 15px;
            border: 1px solid #222;
            background: var(--input-bg);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #444;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            color: #000;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .links { margin-top: 35px; font-size: 13px; color: var(--text-gray); line-height: 2; }
        .links a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .forgot-link { display: block; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>SSM LOGIN</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">ENTER SYSTEM</button>
        </form>

        <div class="links">
            Don't have an account? <a href="register.html">Register</a>
            <a href="forgot.html" class="forgot-link">Forgot Password?</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        firebase.initializeApp(firebaseConfig);

        const loginForm = document.getElementById('loginForm');
        const eyeIcon = document.getElementById('eyeIcon');
        const passwordInput = document.getElementById('password');

        eyeIcon.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('fa-eye-slash');
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            btn.innerText = "LOADING...";
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            
            firebase.auth().signInWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                const user = userCredential.user;
                
                // Halkan wuxuu u weecinayaa faylalka saxda ah
                if(user.email.toLowerCase() === "keyamiin811@gmail.com") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            })
            .catch((error) => {
                alert("Khalad: " + error.message);
                btn.innerText = "ENTER SYSTEM";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>

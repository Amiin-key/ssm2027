<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.3);
            --bg: #000000;
            --card: #121212;
            --input-bg: #080808;
            --text-gray: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            padding: 50px 30px;
            border-radius: 40px; /* Geesaha aad u wareegsan sida sawirka */
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #1e1e1e;
        }

        h2 {
            font-family: 'Orbitron';
            color: var(--primary);
            margin-bottom: 40px;
            font-size: 24px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 15px; /* Geesaha waxyar wareegsan */
            border: 1px solid #222;
            background: var(--input-bg);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        input::placeholder {
            color: #444;
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #444;
            font-size: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 15px;
            font-family: 'Poppins';
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            color: #000;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-login:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .links {
            margin-top: 35px;
            font-size: 13px;
            color: var(--text-gray);
            line-height: 2;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .links .register-link {
            color: var(--primary);
            font-weight: 600;
        }

        .forgot-link {
            display: block;
            margin-top: 15px;
            font-weight: 500 !important;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>SSM LOGIN</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" id="eyeIcon"></i>
            </div>
            <button type="submit" class="btn-login">ENTER SYSTEM</button>
        </form>

        <div class="links">
            Don't have an account? <a href="register.html" class="register-link">Register</a>
            <a href="forgot.html" class="forgot-link">Forgot Password?</a>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };
        firebase.initializeApp(firebaseConfig);

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            
            firebase.auth().signInWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                const user = userCredential.user;
                if(user.email === "keyamiin811@gmail.com") {
                    window.location.href = "admin.html"; // Wuxuu u dirayaa bogga admin-ka
                } else {
                    window.location.href = "home.html"; // Wuxuu u dirayaa user-ka caadiga ah
                }
            })
            .catch((error) => alert(error.message));
        }
    </script>

</body>
</html>

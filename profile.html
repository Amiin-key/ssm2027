<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | SSM INVEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <style>
        :root {
            --primary: #00ff88;
            --bg: #050505;
            --card: #121212;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00d4ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #fff; padding-bottom: 100px; overflow-x: hidden; }

        /* HEADER ANIMATION */
        .profile-bg {
            height: 180px;
            background: linear-gradient(45deg, #00ff88, #005533, #00d4ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            border-radius: 0 0 40px 40px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-content {
            margin-top: -80px;
            text-align: center;
            padding: 0 20px;
        }

        .avatar-container {
            position: relative;
            width: 130px; height: 130px;
            margin: 0 auto 15px;
        }

        .avatar-main {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #222;
            border: 4px solid var(--bg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 50px; color: var(--primary); font-weight: 700;
        }

        .avatar-main img { width: 100%; height: 100%; object-fit: cover; }

        .cam-icon {
            position: absolute; bottom: 5px; right: 5px;
            background: var(--primary); color: #000;
            width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid var(--bg); cursor: pointer;
        }

        .user-meta h2 { font-size: 24px; font-weight: 600; letter-spacing: 0.5px; }
        .user-meta .badge { font-size: 14px; color: var(--accent); margin-left: 5px; }
        .user-meta p { color: #888; font-size: 13px; margin-bottom: 20px; }

        /* STATS BOXES */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; padding: 0 20px; margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card); padding: 15px; border-radius: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-card i { font-size: 20px; color: var(--primary); margin-bottom: 8px; }
        .stat-card span { display: block; font-size: 11px; color: #666; text-transform: uppercase; }
        .stat-card b { font-size: 16px; color: #fff; }

        /* ACTION LINKS */
        .menu-section { padding: 0 20px; }
        .menu-label { font-size: 11px; color: #444; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; padding-left: 10px; }
        
        .menu-list { background: var(--card); border-radius: 25px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 25px; }
        
        .menu-item {
            padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: #eee; border-bottom: 1px solid var(--border);
            transition: 0.3s;
        }
        .menu-item:active { background: rgba(255,255,255,0.05); }
        .menu-item:last-child { border: none; }
        
        .menu-info { display: flex; align-items: center; gap: 15px; }
        .menu-info i { width: 35px; height: 35px; background: rgba(255,255,255,0.03); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 16px; }
        
        .menu-item .fa-chevron-right { font-size: 12px; color: #333; }

        /* EDIT MODE INPUTS */
        .edit-input {
            background: #1a1a1a; border: 1px solid #333; color: #fff;
            padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px;
            display: none; text-align: center; outline: none;
        }
        .edit-input:focus { border-color: var(--primary); }

        .save-btn {
            background: var(--primary); color: #000; border: none;
            padding: 12px 30px; border-radius: 12px; font-weight: 700;
            display: none; margin: 10px auto; cursor: pointer;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; padding: 15px;
            border-top: 1px solid var(--border); z-index: 1000;
        }
        .nav-item { color: #555; text-decoration: none; text-align: center; font-size: 10px; transition: 0.3s; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
    </style>
</head>
<body>

    <div class="profile-bg"></div>

    <div class="header-content">
        <div class="avatar-container">
            <div class="avatar-main" id="avatarDisplay">
                <span id="initials">S</span>
            </div>
            <label for="photoInput" class="cam-icon">
                <i class="fas fa-camera"></i>
            </label>
            <input type="file" id="photoInput" hidden accept="image/*" onchange="uploadPhoto(this)">
        </div>

        <div class="user-meta">
            <h2 id="userNameDisplay">SSM User <i class="fas fa-check-circle badge"></i></h2>
            <input type="text" id="editName" class="edit-input" placeholder="Enter Full Name">
            
            <p id="userEmailDisplay">user@ssminvest.com</p>
            <input type="email" id="editEmail" class="edit-input" placeholder="Enter New Email">
            
            <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save Changes</button>
            
            <div id="editTrigger" onclick="toggleEdit()" style="color: var(--primary); font-size: 12px; cursor: pointer; text-decoration: underline;">Edit Profile</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-users"></i>
            <span>Referrals</span>
            <b id="refCount">0</b>
        </div>
        <div class="stat-card">
            <i class="fas fa-shield-alt"></i>
            <span>Status</span>
            <b style="color: var(--primary);">Verified</b>
        </div>
    </div>

    <div class="menu-section">
        <p class="menu-label">Koontada</p>
        <div class="menu-list">
            <a href="history.html" class="menu-item">
                <div class="menu-info"><i class="fas fa-history"></i> Transaction History</div>
                <i class="fas fa-chevron-right"></i>
            </a>
            <a href="invest.html" class="menu-item">
                <div class="menu-info"><i class="fas fa-rocket"></i> My Investments</div>
                <i class="fas fa-chevron-right"></i>
            </a>
        </div>

        <p class="menu-label">Xiriirka & Amniga</p>
        <div class="menu-list">
            <a href="https://wa.me/yournumber" class="menu-item">
                <div class="menu-info"><i class="fab fa-whatsapp"></i> WhatsApp Support</div>
                <i class="fas fa-chevron-right"></i>
            </a>
            <a href="#" class="menu-item" onclick="logout()" style="color: #ff4757;">
                <div class="menu-info"><i class="fas fa-sign-out-alt" style="color: #ff4757;"></i> Logout Account</div>
            </a>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i><span>Home</span></a>
        <a href="invest.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Invest</span></a>
        <a href="history.html" class="nav-item"><i class="fas fa-history"></i><span>History</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user-circle"></i><span>Profile</span></a>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "ssm-invest.firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "ssm-invest.appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();

    let isEditing = false;

    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                const data = doc.data();
                document.getElementById('userNameDisplay').innerHTML = `${data.fullName} <i class="fas fa-check-circle badge"></i>`;
                document.getElementById('editName').value = data.fullName;
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('editEmail').value = user.email;
                document.getElementById('refCount').innerText = data.referralCount || 0;

                const avatarDiv = document.getElementById('avatarDisplay');
                if (data.profilePic) {
                    avatarDiv.innerHTML = `<img src="${data.profilePic}">`;
                } else {
                    avatarDiv.innerHTML = data.fullName.charAt(0).toUpperCase();
                }
            });
        } else { window.location.href = "log.html"; }
    });

    function toggleEdit() {
        isEditing = !isEditing;
        const displays = [document.getElementById('userNameDisplay'), document.getElementById('userEmailDisplay'), document.getElementById('editTrigger')];
        const inputs = [document.getElementById('editName'), document.getElementById('editEmail'), document.getElementById('saveBtn')];
        
        if (isEditing) {
            displays.forEach(d => d.style.display = 'none');
            inputs.forEach(i => i.style.display = 'block');
        } else {
            displays.forEach(d => d.style.display = 'block');
            inputs.forEach(i => i.style.display = 'none');
        }
    }

    async function saveProfile() {
        const user = auth.currentUser;
        const newName = document.getElementById('editName').value;
        const newEmail = document.getElementById('editEmail').value;
        const saveBtn = document.getElementById('saveBtn');

        saveBtn.innerText = "Processing...";
        try {
            if (newEmail !== user.email) await user.updateEmail(newEmail);
            await db.collection("users").doc(user.uid).update({ fullName: newName });
            alert("Xogtaada waa la cusboonaysiiyey!");
            toggleEdit();
        } catch (e) { alert(e.message); }
        saveBtn.innerText = "Save Changes";
    }

    async function uploadPhoto(input) {
        if (!input.files[0]) return;
        const file = input.files[0];
        const user = auth.currentUser;
        const avatarDiv = document.getElementById('avatarDisplay');
        avatarDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            const ref = storage.ref(`profiles/${user.uid}`);
            await ref.put(file);
            const url = await ref.getDownloadURL();
            await db.collection("users").doc(user.uid).update({ profilePic: url });
        } catch (e) { alert("Cilad sawirka: " + e.message); }
    }

    function logout() { auth.signOut().then(() => window.location.href = "log.html"); }
</script>
</body>
    </html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | SSM INVEST</title>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root {
            --primary: #00ff88;
            --bg: #050505;
            --card: #111;
            --text: #ffffff;
            --accent: #ff4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-size: 20px;
        }

        /* PROFILE CARD */
        .user-card {
            margin: 20px;
            padding: 30px;
            background: linear-gradient(145deg, #0f0f0f, #1a1a1a);
            border-radius: 30px;
            text-align: center;
            border: 1px solid #333;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: 900;
            margin: 0 auto 15px;
        }

        .user-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .user-email { color: #888; font-size: 14px; margin-bottom: 20px; }

        /* INFO LIST */
        .info-list { padding: 0 20px; }
        .info-item {
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }
        .info-item i { color: var(--primary); margin-right: 15px; font-size: 18px; }
        .info-label { color: #888; font-size: 13px; }
        .info-value { font-weight: bold; font-size: 16px; }

        /* LOGOUT BUTTON */
        .logout-btn {
            margin: 30px 20px;
            background: rgba(255, 68, 68, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            text-decoration: none;
        }
        .logout-btn:hover {
            background: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div style="font-weight: bold;">Welcome Profile</div>
        <div></div> <!-- Spacer -->
    </div>

    <div class="user-card">
        <div class="user-avatar" id="avatar">U</div>
        <div class="user-name" id="userName">Loading...</div>
        <div class="user-email" id="userEmail">...</div>
    </div>

    <div class="info-list">
        <div class="info-item">
            <div>
                <p class="info-label">Current Balance</p>
                <p class="info-value" id="balance">$0.00</p>
            </div>
            <i class="fas fa-wallet"></i>
        </div>

        <div class="info-item">
            <div>
                <p class="info-label">Active Investments</p>
                <p class="info-value" id="activeInvests">0 Plans</p>
            </div>
            <i class="fas fa-chart-line"></i>
        </div>

        <div class="info-item">
            <div>
                <p class="info-label">Account Status</p>
                <p class="info-value" style="color: var(--primary);">Verified</p>
            </div>
            <i class="fas fa-shield-halved"></i>
        </div>
    </div>

    <div class="logout-btn" onclick="logoutUser()">
        <i class="fas fa-sign-out-alt"></i> Logout Account
    </div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
        authDomain: "://firebaseapp.com",
        projectId: "ssm-invest",
        storageBucket: "://appspot.com",
        messagingSenderId: "1029622095378",
        appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('userName').innerText = data.fullName || "User";
                    document.getElementById('userEmail').innerText = user.email;
                    document.getElementById('avatar').innerText = (data.fullName || "U").charAt(0).toUpperCase();
                    document.getElementById('balance').innerText = "$" + (data.balance || 0).toFixed(2);
                    document.getElementById('activeInvests').innerText = (data.activeInvestments ? data.activeInvestments.length : 0) + " Plans";
                }
            });
        } else {
            window.location.href = "log.html";
        }
    });

    async function logoutUser() {
        if(confirm("Ma hubtaa inaad ka baxdo (Logout)?")) {
            await auth.signOut();
            window.location.href = "log.html";
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ssm2027 - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md space-y-4">
        
        <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-24 h-24 bg-blue-600/10 rounded-full blur-xl"></div>
            
            <div class="flex items-center space-x-4">
                <div id="userAvatar" class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-full flex items-center justify-center text-2xl font-black shadow-lg shadow-blue-600/20">
                    <i class="fa-solid fa-user animate-pulse"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h2 id="profName" class="text-xl font-bold truncate text-white">Gubaya magaca...</h2>
                    <p id="profEmail" class="text-sm text-gray-400 truncate mt-0.5">Gubaya email-ka...</p>
                    <span id="profRoleBadge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20 mt-2 uppercase tracking-wide">
                        <i class="fa-solid fa-shield mr-1 text-[10px]"></i> Loading...
                    </span>
                </div>
            </div>
        </div>

        <div class="bg-gray-900 rounded-2xl border border-gray-800 shadow-2xl overflow-hidden divide-y divide-gray-800/60">
            
            <a href="account_management.html" class="flex items-center justify-between p-4 hover:bg-gray-800/40 transition-all group">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-purple-500/10 text-purple-400 rounded-xl flex items-center justify-center text-sm group-hover:bg-purple-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">Taariikhda Lacagaha</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs group-hover:text-gray-400 transition-colors pr-1"></i>
            </a>

            <a href="invest.html" class="flex items-center justify-between p-4 hover:bg-gray-800/40 transition-all group">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-green-500/10 text-green-400 rounded-xl flex items-center justify-center text-sm group-hover:bg-green-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-money-bill-trend-up"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">Maalgashiga (Invest)</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs group-hover:text-gray-400 transition-colors pr-1"></i>
            </a>

            <div class="flex items-center justify-between p-4 hover:bg-gray-800/40 transition-all group cursor-pointer">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-yellow-500/10 text-yellow-400 rounded-xl flex items-center justify-center text-sm group-hover:bg-yellow-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">Badbaadada & Amniga</span>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-600 text-xs group-hover:text-gray-400 transition-colors pr-1"></i>
            </div>

            <button id="logoutBtn" class="w-full flex items-center justify-between p-4 hover:bg-red-950/20 transition-all group text-left">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center text-sm group-hover:bg-red-600 group-hover:text-white transition-all">
                        <i class="fa-solid fa-power-off"></i>
                    </div>
                    <span class="text-sm font-semibold text-red-400 group-hover:text-red-300 transition-colors">Ka Bax Xisaabta</span>
                </div>
                <i class="fa-solid fa-arrow-right-from-bracket text-red-500/40 text-xs group-hover:text-red-400 transition-colors pr-1"></i>
            </button>

        </div>

        <a href="dashboard.html" class="block w-full text-center bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-white py-3 rounded-xl font-bold transition-all border border-gray-800/80 text-sm">
            <i class="fa-solid fa-house mr-2 text-xs"></i> Ku Laabo Dashboard-ka
        </a>

    </div>

    <script type="module">
        import { auth, db } from "./config_firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        // Hubi aqoonsiga qofka soo galay
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        
                        // 1. Shid magaca iyo email-ka
                        document.getElementById('profName').innerText = data.name;
                        document.getElementById('profEmail').innerText = data.email;
                        
                        // 2. Shid Role Badge-ka (User ama Admin)
                        const role = data.role || "user";
                        const roleBadge = document.getElementById('profRoleBadge');
                        roleBadge.innerHTML = `<i class="fa-solid ${role === 'admin' ? 'fa-shield-halved text-red-400' : 'fa-user text-blue-400'} mr-1.5 text-[10px]"></i> ${role}`;
                        
                        if(role === 'admin') {
                            roleBadge.classList.remove('bg-blue-500/10', 'text-blue-400', 'border-blue-500/20');
                            roleBadge.classList.add('bg-red-500/10', 'text-red-400', 'border-red-500/20');
                        }

                        // 3. Samee Avatar Dynamic ah (Xarafka hore ee magaca qofka)
                        if(data.name) {
                            document.getElementById('userAvatar').innerText = data.name.charAt(0).toUpperCase();
                        }
                    }
                } catch (error) {
                    console.error("Xogta profile-ka lama soo akhriyi karo:", error);
                }
            }
        });

        // Nidaamka Logout-ka
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        });
    </script>
</body>
</html>

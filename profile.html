<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM | My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: #111; --danger: #ff4757; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }

        .back-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .back-nav a { color: #fff; text-decoration: none; width: 40px; height: 40px; background: var(--card); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #222; }

        .profile-header { text-align: center; margin-bottom: 30px; }
        .avatar-box { width: 100px; height: 100px; background: rgba(0,255,136,0.1); border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2.5rem; color: var(--primary); box-shadow: 0 0 20px rgba(0,255,136,0.2); }

        .info-list { background: var(--card); border-radius: 25px; border: 1px solid #222; overflow: hidden; margin-bottom: 25px; }
        .info-item { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #222; }
        .info-item:last-child { border-bottom: none; }
        .info-label { display: flex; align-items: center; gap: 12px; color: #888; font-size: 0.85rem; }
        .info-label i { color: var(--primary); width: 20px; }
        .info-value { font-weight: 600; font-size: 0.9rem; color: #fff; }

        .logout-btn { width: 100%; padding: 18px; background: rgba(255,71,87,0.1); border: 1px solid var(--danger); border-radius: 18px; color: var(--danger); font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .logout-btn:active { transform: scale(0.96); background: var(--danger); color: #fff; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <div id="loader"><i class="fa-solid fa-circle-notch fa-spin" style="color: var(--primary); font-size: 2rem;"></i></div>

    <div class="back-nav">
        <a href="dashboard.html"><i class="fa-solid fa-chevron-left"></i></a>
        <h2 style="font-family: 'Orbitron'; font-size: 1rem;">MY PROFILE</h2>
    </div>

    <div class="profile-header">
        <div class="avatar-box"><i class="fa-solid fa-user-astronaut"></i></div>
        <h3 id="display-name" style="font-family: 'Orbitron'; letter-spacing: 1px;">Loading...</h3>
        <p id="display-status" style="color: var(--primary); font-size: 0.75rem; margin-top: 5px;"><i class="fa-solid fa-circle-check"></i> VERIFIED MEMBER</p>
    </div>

    <div class="info-list">
        <div class="info-item">
            <div class="info-label"><i class="fa-solid fa-envelope"></i> Email</div>
            <div class="info-value" id="p-email">---</div>
        </div>
        <div class="info-item">
            <div class="info-label"><i class="fa-solid fa-id-badge"></i> User ID</div>
            <div class="info-value" id="p-id">---</div>
        </div>
        <div class="info-item">
            <div class="info-label"><i class="fa-solid fa-calendar-day"></i> Joined</div>
            <div class="info-value" id="p-joined">---</div>
        </div>
    </div>

    <button class="logout-btn" onclick="secureLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> LOGOUT SESSION
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-ImHhrN8XUe0Nihku-ZBSxUDCibaorA",
            authDomain: "ssm-invest.firebaseapp.com",
            projectId: "ssm-invest",
            storageBucket: "ssm-invest.appspot.com",
            messagingSenderId: "1029622095378",
            appId: "1:1029622095378:web:01d95a354b582c0f7902cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Ka soo saar xogta Firestore
                onSnapshot(doc(db, "users", user.uid), (snapshot) => {
                    document.getElementById('loader').style.display = 'none';
                    if (snapshot.exists()) {
                        const data = snapshot.val() || snapshot.data();
                        document.getElementById('display-name').innerText = (data.fullName || "User").toUpperCase();
                        document.getElementById('p-email').innerText = user.email;
                        document.getElementById('p-id').innerText = user.uid.substring(0, 8) + "...";
                        
                        // Haddii aad leedahay taariikhda la soo biiray
                        const joinedDate = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : "Dhawaan";
                        document.getElementById('p-joined').innerText = joinedDate;
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        window.secureLogout = function() {
            if(confirm("Ma hubtaa inaad ka baxayso nidaamka?")) {
                signOut(auth).then(() => {
                    window.location.href = "login.html";
                });
            }
        }
    </script>
</body>
</html>
